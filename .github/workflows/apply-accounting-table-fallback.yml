name: Apply accounting table fallback

on:
  push:
    branches:
      - fix/accounting-table-fallback
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip accounting patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/accounting-table-fallback
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply table fallback
        run: node scripts/apply-accounting-legacy-table-fallback.js

      - name: Verify fallback
        run: |
          node --check accounting-v2.js
          node scripts/check-accounting-legacy-table-fallback.js
          node scripts/check-accounting-v2.js
          git diff --check

      - name: Commit runtime correction
        run: |
          if git diff --quiet -- accounting-v2.js; then
            echo "Nessuna modifica da applicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounting-v2.js
          git commit -m "Mostra impianti operativi nella tabella contabilità [skip accounting patch]"
          git push origin HEAD:fix/accounting-table-fallback
