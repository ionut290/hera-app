name: Apply driveBridge reuse temp
permissions:
  contents: write
on:
  push:
    branches:
      - audit/drivebridge-20260815
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused change
        run: python3 scripts/apply-drivebridge-reuse-temp.py
      - name: Validate focused change
        run: |
          node --check app.js
          node --check registry-google-sheet-sync.js
          node scripts/check-drivebridge-config-reuse.js
          npm run check:fatto-critical
      - name: Commit focused change
        run: |
          git config user.name ionut290
          git config user.email 148634773+ionut290@users.noreply.github.com
          git add app.js registry-google-sheet-sync.js package.json scripts/check-drivebridge-config-reuse.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reuse driveBridge listener snapshot'
          git push origin HEAD:audit/drivebridge-20260815
