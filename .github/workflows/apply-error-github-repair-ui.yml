name: Apply GitHub repair UI

on:
  push:
    branches: [feature/codex-error-repair]
    paths:
      - scripts/apply-error-github-repair-ui.js
      - .github/workflows/apply-error-github-repair-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/codex-error-repair
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/apply-error-github-repair-ui.js
      - name: Syntax check
        run: node --check admin-error-center.js
      - name: Verify Centro errori runtime
        run: node scripts/check-error-center-runtime.js
      - name: Commit generated change
        run: |
          if git diff --quiet -- admin-error-center.js; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-error-center.js
          git commit -m "feat: connect error repair to GitHub Codex workflow"
          git push origin HEAD:feature/codex-error-repair
