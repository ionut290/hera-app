name: Apply error repair actions

on:
  push:
    branches:
      - feature/error-center-repair-actions
    paths:
      - .github/workflows/apply-error-repair-actions.yml
      - scripts/apply-error-repair-actions.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/error-center-repair-actions
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-error-repair-actions.js

      - name: Syntax check
        run: node --check admin-error-center.js

      - name: Verify Centro errori runtime
        run: node scripts/check-error-center-runtime.js

      - name: Commit generated change
        run: |
          if git diff --quiet -- admin-error-center.js; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-error-center.js
          git commit -m "feat: add find solution and safe repair actions"
          git push origin HEAD:feature/error-center-repair-actions
