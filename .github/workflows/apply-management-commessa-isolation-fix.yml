name: Apply management commessa isolation fix

on:
  push:
    branches:
      - fix/management-commessa-isolation-20260819

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip isolation patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact commessa matching fix
        run: node scripts/apply-management-commessa-isolation-fix.js

      - name: Verify regression
        run: |
          node --check operational-import-repair.js
          node scripts/check-management-commessa-isolation.js
          node scripts/check-commesse-impianti-integrity.js
          git diff --check

      - name: Commit runtime correction
        run: |
          if git diff --quiet -- operational-import-repair.js; then
            echo "Nessuna modifica da applicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operational-import-repair.js
          git commit -m "Isola statistiche gestione per commessa [skip isolation patch]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
