name: Apply occasional squad-first patch

on:
  push:
    branches:
      - feature/occasional-squad-first
    paths:
      - .github/workflows/apply-occasional-squad-first-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/occasional-squad-first
          fetch-depth: 0

      - name: Apply guarded source patch
        run: node scripts/apply-occasional-squad-first-patch.js

      - name: Validate JavaScript syntax
        run: |
          node --check lavori-occasionali.js
          node --check lavori-occasionali-squad-first.js
          node --check firebase-config.js

      - name: Remove temporary patch files
        run: |
          git rm --ignore-unmatch scripts/apply-occasional-squad-first-patch.js
          git rm --ignore-unmatch .github/workflows/apply-occasional-squad-first-patch.yml

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lavori-occasionali.js firebase-config.js lavori-occasionali-squad-first.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Separa creazione squadra e aggiunta cantieri"
          git push origin HEAD:feature/occasional-squad-first
