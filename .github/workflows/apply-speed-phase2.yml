name: Apply speed phase 2

on:
  push:
    branches:
      - feat/speed-lazy-identity-20260815
    paths:
      - .github/workflows/apply-speed-phase2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/speed-lazy-identity-20260815
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply safe lazy-load changes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          css = '  <link rel="stylesheet" href="identity-card-feature.css?v=20260727a">\n'
          js = '  <script src="identity-card-feature.js?v=20260727a"></script>\n'
          loader = '  <script src="identity-feature-lazy-loader.js?v=20260815a"></script>\n'
          if css not in text:
              raise SystemExit('identity css tag not found')
          if js not in text:
              raise SystemExit('identity js tag not found')
          text = text.replace(css, '', 1)
          text = text.replace(js, loader, 1)
          index.write_text(text)

          sw = Path('sw.js')
          sw_text = sw.read_text()
          sw_text = sw_text.replace('const CACHE_NAME = "varga-cantieri-shell-v132";', 'const CACHE_NAME = "varga-cantieri-shell-v133";', 1)
          marker = '  "./heavy-libs-lazy-loader.js?v=20260815a",\n'
          addition = marker + '  "./identity-feature-lazy-loader.js?v=20260815a",\n'
          if marker not in sw_text:
              raise SystemExit('sw marker not found')
          sw_text = sw_text.replace(marker, addition, 1)
          sw.write_text(sw_text)
          PY
      - name: Verify protected files untouched
        run: |
          git diff --exit-code HEAD -- app.js fatto-button-immediate.js native-android-runtime.js || true
          if git diff --name-only | grep -Eq '^(app\.js|fatto-button-immediate\.js|native-android-runtime\.js)$'; then
            echo 'Protected FATTO/WhatsApp files changed' >&2
            exit 1
          fi
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --check
          git commit -m "Rendi Tesserino e PIN lazy all'avvio"
          git push
