name: Audit Firestore Reads

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-firestore-reads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Firestore read audit
        run: npm run audit:firestore-reads
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: firestore-read-audit
          path: audit-output/
          if-no-files-found: error
