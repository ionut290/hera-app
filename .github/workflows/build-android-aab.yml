name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-aab.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Capacitor web directory
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="it">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Varga Cantieri</title>
            </head>
            <body>
              <p>Avvio di Varga Cantieri…</p>
            </body>
          </html>
          HTML

      - name: Create and sync Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Manca il secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/varga-upload.jks"

      - name: Configure Android version and signing
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/varga-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("File android/app/build.gradle non trovato")

          text = path.read_text(encoding="utf-8")
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          store_file = os.environ["ANDROID_KEYSTORE_PATH"].replace("\\", "\\\\")
          store_password = os.environ["ANDROID_KEYSTORE_PASSWORD"].replace("'", "\\'")
          key_alias = os.environ["ANDROID_KEY_ALIAS"].replace("'", "\\'")
          key_password = os.environ["ANDROID_KEY_PASSWORD"].replace("'", "\\'")

          text, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Impossibile aggiornare versionCode/versionName")

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('%s')
                      storePassword '%s'
                      keyAlias '%s'
                      keyPassword '%s'
                  }
              }
          """ % (store_file, store_password, key_alias, key_password)

          android_pos = text.find("android {")
          if android_pos == -1:
              raise SystemExit("Blocco android non trovato")
          insert_at = android_pos + len("android {")
          text = text[:insert_at] + signing_block + text[insert_at:]

          build_types_match = re.search(r"buildTypes\s*\{", text)
          if not build_types_match:
              raise SystemExit("Blocco buildTypes non trovato")

          release_match = re.search(r"release\s*\{", text[build_types_match.end():])
          if not release_match:
              raise SystemExit("Blocco release non trovato")

          release_start = build_types_match.end() + release_match.end()
          text = text[:release_start] + "\n            signingConfig signingConfigs.release" + text[release_start:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Build signed release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify and prepare Android App Bundle
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          unzip -t "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          cp "$AAB" "VARGA-CANTIERI-${{ github.run_number }}.aab"

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: VARGA-CANTIERI-AAB-${{ github.run_number }}
          path: VARGA-CANTIERI-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 30
