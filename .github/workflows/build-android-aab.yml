name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "assets/**"
      - "icons/**"
      - "functions/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - "android-resources/**"
      - ".github/workflows/build-android-aab.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "assets/**"
      - "icons/**"
      - "functions/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - "android-resources/**"
      - ".github/workflows/build-android-aab.yml"

permissions:
  contents: read

jobs:
  build-aab:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Android runtime
        run: |
          npm run sync:service-worker-assets
          npm run check:syntax
          npm run check:app-update
          npm run check:notifications
          npm run check:auth-login
          npm run check:auth-stability
          npm run check:first-login-password
          npm run check:password-recovery-code
          npm run check:login-retry
          npm run check:android-platform
          npm run check:fuel-stations
          npm run check:startup-splash
          npm run check:today-summary
          npm run check:weather
          npm run check:calendar
          npm run check:identity-card
          npm run check:segnalazione-pdf

      - name: Prepare Capacitor web directory
        run: |
          npm run android:aab:prepare
          test -s www/update-app-feature.js
          if ! grep -q 'native-android-runtime.js' www/index.html; then
            echo "index.html non carica native-android-runtime.js"
            exit 1
          fi
          if grep -q "Avvio di Varga Cantieri" www/index.html; then
            echo "La directory web contiene ancora la pagina provvisoria"
            exit 1
          fi

      - name: Create and sync Android project
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/hera-native-android"
          mkdir -p "$RUNNER_TEMP/hera-native-android"
          cp -R android/app/src/main/java "$RUNNER_TEMP/hera-native-android/java"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/hera-native-android/AndroidManifest.xml"
          cp android/app/capacitor.build.gradle "$RUNNER_TEMP/hera-native-android/capacitor.build.gradle"
          rm -rf android
          npx cap add android
          rm -rf android/app/src/main/java
          cp -R "$RUNNER_TEMP/hera-native-android/java" android/app/src/main/java
          cp "$RUNNER_TEMP/hera-native-android/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Manca il secret ANDROID_GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/variables.gradle")
          text = path.read_text(encoding="utf-8")
          marker = "    rgcfaIncludeGoogle = true\n"
          if marker not in text:
              text = text.replace("ext {\n", "ext {\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

          npx cap sync android

          find android/app/src/main/res -type f -name "splash.png" -delete
          cp -R android-resources/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable-xhdpi
          cp icons/varga-cantieri-512.png android/app/src/main/res/drawable-xhdpi/splash_logo.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/drawable/splash.xml
          test -s android/app/src/main/res/drawable-xhdpi/splash_logo.png
          test -s android/app/src/main/res/values-v31/styles.xml

          printf '\n// Integrazioni native Hera\n' >> android/app/capacitor.build.gradle
          cat "$RUNNER_TEMP/hera-native-android/capacitor.build.gradle" >> android/app/capacitor.build.gradle

          grep -q "capacitor-geolocation" android/app/capacitor.build.gradle
          grep -q "capacitor-push-notifications" android/app/capacitor.build.gradle
          grep -q "play-services-location" android/app/capacitor.build.gradle
          grep -q "androidx.biometric" android/app/capacitor.build.gradle

      - name: Enforce Play target API 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")
          if not path.exists():
              raise SystemExit("File android/variables.gradle non trovato")

          text = path.read_text(encoding="utf-8")
          replacements = {
              "compileSdkVersion": "36",
              "targetSdkVersion": "36",
          }

          for key, value in replacements.items():
              pattern = rf"(^\s*{re.escape(key)}\s*=\s*)\d+"
              text, count = re.subn(pattern, rf"\g<1>{value}", text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Impossibile aggiornare {key} in android/variables.gradle")

          path.write_text(text, encoding="utf-8")
          PY

          grep -Eq '^\s*compileSdkVersion\s*=\s*36' android/variables.gradle
          grep -Eq '^\s*targetSdkVersion\s*=\s*36' android/variables.gradle

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Manca il secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/varga-upload.jks"

      - name: Configure Android version and signing
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/varga-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("File android/app/build.gradle non trovato")

          text = path.read_text(encoding="utf-8")
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          store_file = os.environ["ANDROID_KEYSTORE_PATH"].replace("\\", "\\\\")
          store_password = os.environ["ANDROID_KEYSTORE_PASSWORD"].replace("'", "\\'")
          key_alias = os.environ["ANDROID_KEY_ALIAS"].replace("'", "\\'")
          key_password = os.environ["ANDROID_KEY_PASSWORD"].replace("'", "\\'")

          text, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version_name}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Impossibile aggiornare versionCode/versionName")

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('%s')
                      storePassword '%s'
                      keyAlias '%s'
                      keyPassword '%s'
                  }
              }
          """ % (store_file, store_password, key_alias, key_password)

          android_pos = text.find("android {")
          if android_pos == -1:
              raise SystemExit("Blocco android non trovato")
          insert_at = android_pos + len("android {")
          text = text[:insert_at] + signing_block + text[insert_at:]

          build_types_match = re.search(r"buildTypes\s*\{", text)
          if not build_types_match:
              raise SystemExit("Blocco buildTypes non trovato")

          release_match = re.search(r"release\s*\{", text[build_types_match.end():])
          if not release_match:
              raise SystemExit("Blocco release non trovato")

          release_start = build_types_match.end() + release_match.end()
          text = text[:release_start] + "\n            signingConfig signingConfigs.release" + text[release_start:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build signed release bundle and test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify 16 KB native library alignment
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          unzip -q "$AAB" -d "$CHECK_DIR"
          while IFS= read -r native_library; do
            while IFS= read -r alignment_hex; do
              alignment=$((alignment_hex))
              if (( alignment < 16384 )); then
                echo "Libreria non compatibile con pagine da 16 kB: $native_library ($alignment_hex)"
                exit 1
              fi
            done < <(readelf -lW "$native_library" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$CHECK_DIR" -type f -name '*.so' -print)

      - name: Verify official Android App Bundle
        shell: bash
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          unzip -t "$AAB"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload official Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: VARGA-CANTIERI-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Verify signed Android test APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -t "$APK"
          jarsigner -verify -verbose -certs "$APK"

      - name: Upload signed Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: VARGA-CANTIERI-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare authenticated-view fixture for emulator only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("android/app/src/main/assets/public/index.html")
          text = index_path.read_text(encoding="utf-8")
          marker = """
          <style id="android-e2e-authenticated-view">
            /* Solo APK effimero di test: mostra la Home interna senza credenziali. */
            #auth-gate { display: none !important; }
            body.auth-pending .container,
            body.auth-required .container { display: grid !important; }
            #home-page { display: grid !important; }
          </style>
          """
          if "android-e2e-authenticated-view" in text:
              raise SystemExit("Fixture Android gia presente")
          if "</head>" not in text:
              raise SystemExit("Chiusura head non trovata")
          index_path.write_text(text.replace("</head>", marker + "\n</head>", 1), encoding="utf-8")
          PY

      - name: Build isolated emulator fixture APK
        working-directory: android
        run: ./gradlew assembleRelease --rerun-tasks --no-daemon

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p android-emulator-test
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant it.vargacantieri.hera android.permission.POST_NOTIFICATIONS
            adb shell pm grant it.vargacantieri.hera android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant it.vargacantieri.hera android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant it.vargacantieri.hera android.permission.CAMERA
            adb shell am force-stop it.vargacantieri.hera
            adb shell am start -W -n it.vargacantieri.hera/.MainActivity > android-emulator-test/activity-start.txt
            sleep 12
            adb shell dumpsys activity activities > android-emulator-test/activities.txt
            grep -q 'ResumedActivity:.*it.vargacantieri.hera/.MainActivity' android-emulator-test/activities.txt
            adb shell uiautomator dump /sdcard/varga-window.xml
            adb pull /sdcard/varga-window.xml android-emulator-test/window.xml
            adb exec-out screencap -p > android-emulator-test/squadre.png
            grep -Eq 'resource-id="it\.vargacantieri\.hera:id/webview".*bounds="\[0,0\]\[1080,2400\]"' android-emulator-test/window.xml
            ! grep -Eiq 'action_bar_container|action_bar_title|decor_content_parent' android-emulator-test/window.xml

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VARGA-CANTIERI-ANDROID-TEST-${{ github.run_number }}
          path: android-emulator-test/
          if-no-files-found: warn
          retention-days: 30
