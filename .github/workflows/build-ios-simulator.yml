name: Varga Cantieri iOS Simulator (no deploy)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Unsigned iOS simulator build
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require App Store-supported Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { print $2 }' | cut -d. -f1)"
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          if [[ -z "$XCODE_MAJOR" || "$XCODE_MAJOR" -lt 26 || -z "$SDK_MAJOR" || "$SDK_MAJOR" -lt 26 ]]; then
            echo "App Store 2026: richiesti Xcode 26+ e iOS SDK 26+." >&2
            exit 1
          fi

      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund

      - name: Check protected application flows
        run: |
          npm run check:fatto-whazzup-immutable
          npm run check:fatto-isolation
          npm run check:auth-stability
          npm run check:security-privacy
          npm run check:syntax

      - name: Prepare existing web bundle without modifying its source
        run: |
          npm run android:aab:prepare
          test -s www/index.html
          test -s www/app.js
          test -s www/firebase-config.js
          test -s www/icons/varga-cantieri-512.png
          python3 -m py_compile scripts/configure-ios-plist.py

      - name: Add patched Capacitor iOS 7 platform for this build only
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/ios@7.6.10 @capacitor/core@7.6.10
          node -e "const c=require('@capacitor/core/package.json').version; const i=require('@capacitor/ios/package.json').version; if(c!==i)throw Error('Capacitor core/iOS mismatch: '+c+' vs '+i);"
          npx cap add ios
          npx cap sync ios
          python3 scripts/configure-ios-plist.py
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Configure registered Firebase iOS app when provided
        shell: bash
        env:
          IOS_FIREBASE_CONFIG_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.IOS_FIREBASE_CONFIG_BASE64 || '' }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/configure-ios-firebase.py
          ruby -c scripts/register-ios-firebase-plist.rb
          if [[ -z "${IOS_FIREBASE_CONFIG_BASE64}" ]]; then
            echo "::warning::Firebase iOS config absent. The simulator build does not validate native Firebase sign-in."
          else
            umask 077
            printf '%s' "${IOS_FIREBASE_CONFIG_BASE64}" | base64 --decode > ios/App/App/GoogleService-Info.plist
            python3 scripts/configure-ios-firebase.py
            ruby scripts/register-ios-firebase-plist.rb
            echo "FIREBASE_IOS_CONFIG_INJECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Build for iOS Simulator without Apple certificates
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/varga-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/varga-ios-build.log"

      - name: Assert native Firebase config packaged when supplied
        if: env.FIREBASE_IOS_CONFIG_INJECTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP_PLIST="$RUNNER_TEMP/varga-ios-derived/Build/Products/Debug-iphonesimulator/App.app/GoogleService-Info.plist"
          test -s "$APP_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$APP_PLIST" | grep -Fx 'it.vargacantieri.hera'

      - name: Install and launch on iPhone Simulator (no sign-in)
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash scripts/smoke-ios-simulator.sh \
            "$RUNNER_TEMP/varga-ios-derived/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/varga-ios-simulator-launch.png"

      - name: Upload simulator screenshot for manual visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: varga-cantieri-ios-launch-screenshot
          path: ${{ runner.temp }}/varga-ios-simulator-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload launch diagnostics only when available
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: varga-cantieri-ios-launch-diagnostics
          path: ${{ runner.temp }}/varga-ios-simulator-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned simulator app
        if: success() && env.FIREBASE_IOS_CONFIG_INJECTED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: varga-cantieri-ios-simulator-unsigned
          path: ${{ runner.temp }}/varga-ios-derived/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error
          retention-days: 7

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: varga-cantieri-ios-build-log
          path: ${{ runner.temp }}/varga-ios-build.log
          if-no-files-found: ignore
          retention-days: 7
