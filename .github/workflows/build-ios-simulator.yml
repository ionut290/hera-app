name: Varga Cantieri iOS 1.0.1 compile only (NO UPLOAD)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Unsigned iPhone device build 1.0.1
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require App Store-supported Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { print $2 }' | cut -d. -f1)"
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          if [[ -z "$XCODE_MAJOR" || "$XCODE_MAJOR" -lt 26 || -z "$SDK_MAJOR" || "$SDK_MAJOR" -lt 26 ]]; then
            echo "App Store 2026: richiesti Xcode 26+ e iOS SDK 26+." >&2
            exit 1
          fi

      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund

      - name: Check protected application flows
        run: |
          npm run check:fatto-whazzup-immutable
          npm run check:fatto-isolation
          npm run check:auth-stability
          npm run check:security-privacy
          npm run check:syntax

      - name: Prepare existing web bundle without modifying its source
        run: |
          npm run android:aab:prepare
          test -s www/index.html
          test -s www/app.js
          test -s www/firebase-config.js
          test -s www/icons/varga-cantieri-512.png
          python3 -m py_compile scripts/configure-ios-plist.py
          ruby -c scripts/configure-ios-distribution-signing.rb
          bash -n scripts/smoke-ios-simulator.sh

      - name: Generate native iOS as in approved build 20029
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7.6.10 @capacitor/ios@7.6.10
          node -e "const c=require('@capacitor/core/package.json').version,i=require('@capacitor/ios/package.json').version;if(c!==i)throw Error('Capacitor mismatch');"
          npx cap add ios
          ruby scripts/install-ios-google-signin.rb
          (cd ios/App && pod update GTMSessionFetcher/Core)
          npx cap sync ios
          python3 scripts/mark-ios-native-safe-area.py
          ruby scripts/install-ios-native-geofence.rb
          ruby scripts/install-ios-apple-signin.rb
          test -s ios/App/App/App.entitlements
          python3 scripts/configure-ios-plist.py
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Prepare opaque Varga Cantieri iOS app icon
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/prepare-ios-app-icon.swift \
            icons/varga-cantieri-512.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Record review readiness separately (read-only; no release)
        shell: bash
        run: node scripts/audit-app-review-full-access.cjs

      - name: Compile unsigned device candidate 1.0.1 (20030)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/varga-ios-derived" \
            MARKETING_VERSION=1.0.1 \
            CURRENT_PROJECT_VERSION=20030 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/varga-ios-build.log" 2>&1 ||
            { tail -n 100 "$RUNNER_TEMP/varga-ios-build.log"; exit 1; }
          APP_PLIST="$RUNNER_TEMP/varga-ios-derived/Build/Products/Release-iphoneos/App.app/Info.plist"
          test -s "$APP_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST" | grep -Fx '1.0.1'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST" | grep -Fx '20030'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST" | grep -Fx 'it.vargacantieri.hera'
          echo "Unsigned device compilation passed. Not signed, not installable, no Firebase native auth test, no App Store upload."
