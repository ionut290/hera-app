name: Calendar Admin Reminders

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verifica accesso e ricerca eventi senza inviare notifiche"
        required: true
        default: true
        type: boolean
  schedule:
    # 07:05 in Italia: 05:05 UTC con ora legale, 06:05 UTC con ora solare.
    - cron: "5 5 * * *"
    - cron: "5 6 * * *"

permissions:
  contents: read

concurrency:
  group: calendar-admin-reminders
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Notify admins about tomorrow calendar events
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node functions/run-calendar-admin-reminders.js
