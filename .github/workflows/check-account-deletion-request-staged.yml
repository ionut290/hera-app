name: Check staged authenticated deletion request (no Firebase or deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - "functions/account-deletion-request.js"
      - "account-privacy-controls.js"
      - "scripts/check-account-deletion-request-staged.cjs"
      - "scripts/check-account-privacy-client-runtime.js"
      - "scripts/check-account-privacy-sw-cache.cjs"
      - ".github/workflows/check-account-deletion-request-staged.yml"
      - ".github/workflows/deploy-firebase-functions.yml"
      - ".github/workflows/deploy-account-deletion-request-protected.yml"
      - "scripts/check-account-deletion-request-release-guard.cjs"
      - "index.html"
      - "sw.js"
      - "firebase.json"
      - "scripts/check-firebase-hosting-public-safety.cjs"
      - "delete-account.html"
      - "scripts/check-delete-account-public-page.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax, synthetic Firebase request and browser isolation (NO SECRETS)
        run: |
          set -euo pipefail
          node --check functions/account-deletion-request.js
          node --check account-privacy-controls.js
          node --check scripts/check-account-deletion-request-staged.cjs
          node scripts/check-account-deletion-request-staged.cjs
          node scripts/check-account-deletion-request-release-guard.cjs
          node scripts/check-account-privacy-client-runtime.js
          node scripts/check-account-privacy-sw-cache.cjs
          node scripts/check-delete-account-public-page.cjs
          node scripts/check-firebase-hosting-public-safety.cjs
      - name: Assert no accidental production release
        run: |
          set -euo pipefail
          if grep -Eq 'require\(["\x27]\./account-deletion-request["\x27]\)' functions/main.js; then
            echo "::error::Staged deletion request unexpectedly exported in production functions main"
            exit 1
          fi
          # Routine Firebase releases are now entirely MANUAL and guarded.
          # They must never export or deploy the staged deletion-request callables.
          grep -Fq 'node scripts/check-solo-owner-release-policy.cjs --verify' .github/workflows/deploy-firebase-functions.yml
          ! grep -Eq '^  push:' .github/workflows/deploy-firebase-functions.yml
          ! grep -Eq -- '--only .*functions:requestOwnVargaAccountDeletion' .github/workflows/deploy-firebase-functions.yml
          ! grep -Eq -- '--only .*functions:getOwnVargaAccountDeletionStatus' .github/workflows/deploy-firebase-functions.yml
          echo "PASS: request callable is staged only; no data accessed and no Firebase deployed."
