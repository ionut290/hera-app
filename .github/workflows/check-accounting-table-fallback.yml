name: Check accounting table fallback

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  accounting-table-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check fallback table behavior
        run: |
          node --check accounting-v2.js
          node scripts/check-accounting-legacy-table-fallback.js
          node scripts/check-accounting-v2.js
