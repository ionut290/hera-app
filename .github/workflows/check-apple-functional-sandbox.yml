name: Test Apple functional fixtures (FIRESTORE EMULATOR ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/test-app-review-functional-sandbox.cjs"
      - "firestore.rules"
      - ".github/workflows/check-apple-functional-sandbox.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      GOOGLE_CLOUD_PROJECT: demo-apple-functional-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install local testing dependencies only
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing@4.0.1
      - name: Ensure script cannot use production credentials or remote endpoints
        run: |
          set -euo pipefail
          node --check scripts/test-app-review-functional-sandbox.cjs
          grep -Fq 'FIRESTORE_EMULATOR_HOST' scripts/test-app-review-functional-sandbox.cjs
          grep -Fq 'demo-apple-functional-sandbox' scripts/test-app-review-functional-sandbox.cjs
          if grep -E 'hera-app-6cd2b|GOOGLE_APPLICATION_CREDENTIALS|firebase-admin|https?://' scripts/test-app-review-functional-sandbox.cjs; then
            echo "::error::Production access forbidden in local-only test"
            exit 1
          fi
      - name: Test actual Firestore rules using only fake documents
        run: |
          set -euo pipefail
          npx --yes firebase-tools@14.23.0 emulators:exec --only firestore \
            --project demo-apple-functional-sandbox \
            'node scripts/test-app-review-functional-sandbox.cjs'
