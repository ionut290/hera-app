name: Check legacy reviewer backend restrictions and iOS bundle (no deploy)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  reviewer-account-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify existing reviewer identities remain denied by backend guards
        run: node scripts/check-apple-review-account.js
      - name: Verify immutable FATTO and Whazzup
        run: |
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js
      - name: Verify login contract
        run: node scripts/check-auth-stability-contract.js
      - name: Verify native bundle EXCLUDES Apple reviewer-only behavior
        run: |
          node scripts/prepare-capacitor-web.js
          node scripts/check-appstore-2519-clean.js
