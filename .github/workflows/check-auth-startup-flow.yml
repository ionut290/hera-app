name: Check auth startup flow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  auth-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-auth-startup-flow.js
      - run: node scripts/check-auth-stability-contract.js
      - run: node scripts/check-auth-profile-recovery.js
        if: always()
