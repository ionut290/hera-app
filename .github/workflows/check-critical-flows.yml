name: Check critical Varga Cantieri flows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  critical-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run check:syntax
      - name: Check commesse and impianti integrity
        run: npm run check:commesse-impianti
      - name: Check impianto change index
        run: node scripts/check-impianto-change-index.js
      - name: Check app module boundaries
        run: node scripts/check-app-module-boundaries.js
      - name: Check automatic PWA build versioning
        run: node scripts/check-pwa-build-versioning.js
      - name: Audit unused functions
        run: node scripts/audit-unused-functions.js
      - name: Check header loader dedupe
        run: node scripts/check-header-loader-dedupe.js
      - name: Check Firebase loader dedupe
        run: node scripts/check-firebase-loader-dedupe.js
      - name: Check inline Firestore diagnostics cleanup
        run: node scripts/check-firestore-diagnostics-cleanup-inline.js
      - name: Check removed dead nested-listener optimizer
        run: node scripts/check-no-dead-nested-listener-optimizer.js
      - name: Check lazy admin user profiles
        run: node scripts/check-admin-user-profiles-lazy.js
      - name: Check FATTO core
        run: npm run check:done-button
      - name: Check Android photo share
        run: npm run check:android-photo-share
      - name: Check Android camera capture
        run: npm run check:android-camera-capture
      - name: Check photo notes
        run: npm run check:photo-notes
      - name: Check WhatsApp protection
        run: npm run check:whatsapp-protection
      - name: Check nine fundamental flows
        run: node scripts/check-critical-flows.js
