name: Check critical Varga Cantieri flows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  critical-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run check:syntax
      - name: Check FATTO critical flow
        run: npm run check:fatto-critical
      - name: Check nine fundamental flows
        run: node scripts/check-critical-flows.js
