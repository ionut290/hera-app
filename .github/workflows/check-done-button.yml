name: Check FATTO and Whazzup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: fatto-whazzup-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify immutable FATTO Whazzup lock
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          node scripts/check-fatto-whazzup-immutable.js
          test "$(git hash-object scripts/check-fatto-whazzup-isolation.js)" = "5165a30e4867a7018b7147848076a2d36bc478c3"
          node scripts/check-fatto-whazzup-isolation.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify FATTO and Whazzup
        run: npm run check:fatto-critical
