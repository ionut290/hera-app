name: Check FATTO and Whazzup

on:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "index.html"
      - "sw.js"
      - "native-android-runtime.js"
      - "varga-branding.js"
      - "whazzup-preload-cache.js"
      - "fatto-button-immediate.js"
      - "android/app/src/main/java/it/vargacantieri/hera/whatsapp/**"
      - "scripts/check-done-button-*.js"
      - "scripts/check-android-done-push.js"
      - "scripts/check-whatsapp-protection.js"
      - "scripts/check-fatto-whazzup-immutable.js"
      - "AGENTS.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-done-button.yml"
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "sw.js"
      - "native-android-runtime.js"
      - "varga-branding.js"
      - "whazzup-preload-cache.js"
      - "fatto-button-immediate.js"
      - "android/app/src/main/java/it/vargacantieri/hera/whatsapp/**"
      - "scripts/check-done-button-*.js"
      - "scripts/check-android-done-push.js"
      - "scripts/check-whatsapp-protection.js"
      - "scripts/check-fatto-whazzup-immutable.js"
      - "AGENTS.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-done-button.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatto-whazzup-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify immutable FATTO Whazzup lock
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          node scripts/check-fatto-whazzup-immutable.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify FATTO and Whazzup
        run: npm run check:fatto-critical
