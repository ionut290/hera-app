name: Check browser E2E smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e-smoke:
    runs-on: ubuntu-24.04
    # Prebuilt Playwright image pins Chromium and Linux dependencies to the
    # exact test-runner version, avoiding intermittent apt/browser downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolated FATTO Whazzup perimeter
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          test "$(git hash-object scripts/check-fatto-whazzup-isolation.js)" = "7f2f7f4be8f08ebd65ac69fe21139b7eb601d4d1"
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js
      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      - name: Start local PWA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/varga-e2e-server.log 2>&1 &
          echo $! > /tmp/varga-e2e-server.pid
          # GitHub container steps use POSIX sh, not Bash: brace expansion would
          # run just once and fail before the background server starts.
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/varga-e2e-server.log
          exit 1
      - name: Run startup and reload smoke tests
        env:
          E2E_APP_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/startup-smoke.spec.js --browser=chromium --workers=1 --reporter=line
