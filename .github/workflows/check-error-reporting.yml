name: Check error reporting

on:
  pull_request:
    paths:
      - "client-error-reporter.js"
      - "admin-error-center.js"
      - "admin-error-center.css"
      - "loading-humor.js"
      - "functions/error-reporting.js"
      - "functions/error-center.js"
      - "functions/main.js"
      - "scripts/check-error-reporting.js"
      - "scripts/check-error-center-runtime.js"
      - "_headers"
      - "sw.js"
      - "ADMIN_ERROR_CENTER.md"
      - "ERROR_REPORTING_SETUP.md"
      - ".github/workflows/check-error-reporting.yml"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: |
          node --check client-error-reporter.js
          node --check admin-error-center.js
          node --check loading-humor.js
          node --check sw.js
          node --check functions/error-reporting.js
          node --check functions/error-center.js
          node --check functions/main.js
          node --check scripts/check-error-reporting.js
          node --check scripts/check-error-center-runtime.js
      - name: Check safety guards
        run: |
          node scripts/check-error-reporting.js
          node scripts/check-error-center-runtime.js
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Load Cloud Functions entrypoint
        run: node -e "require('./functions/main.js'); console.log('Functions loaded successfully')"
