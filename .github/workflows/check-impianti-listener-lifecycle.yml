name: Check impianti listener lifecycle

on:
  pull_request:
    paths:
      - 'commessa-navigation-repair.js'
      - 'scripts/check-impianti-listener-lifecycle.js'
      - '.github/workflows/check-impianti-listener-lifecycle.yml'
  push:
    branches:
      - main
    paths:
      - 'commessa-navigation-repair.js'
      - 'scripts/check-impianti-listener-lifecycle.js'
      - '.github/workflows/check-impianti-listener-lifecycle.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lifecycle guard
        run: node scripts/check-impianti-listener-lifecycle.js
