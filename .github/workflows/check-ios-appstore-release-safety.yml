name: Check iOS App Store build floor (offline, no upload)
on:
  push:
    branches: [release/ios-servizio-neve-20261126]
    paths:
      - 'scripts/check-ios-appstore-build-number.cjs'
      - '.github/workflows/ios-appstore-candidate.yml'
      - '.github/workflows/check-ios-appstore-release-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ios-appstore-candidate.yml"
      - ".github/workflows/check-ios-appstore-release-safety.yml"
      - "scripts/check-ios-appstore-build-number.sh"
      - "scripts/check-ios-appstore-build-number.cjs"
      - "docs/APP_REVIEW_FULL_ACCESS_PLAN_2026-11-20.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify both upload stages enforce the latest confirmed build floor
        run: |
          set -euo pipefail
          bash -n scripts/check-ios-appstore-build-number.sh
          node --check scripts/check-ios-appstore-build-number.cjs
          node scripts/check-ios-appstore-build-number.cjs
      - name: Check snow, salatura and privacy regressions without deploying
        run: |
          set -euo pipefail
          node scripts/check-snow-castel-maggiore.js
          node scripts/check-salatura-strada.cjs
          node scripts/check-salatura-unified.cjs
          node scripts/check-account-privacy-client-runtime.js
          node scripts/check-account-privacy-sw-cache.cjs
      - name: Verify no deployment credentials or App Store request in this check
        run: |
          set -euo pipefail
          test ! -e ios/App/App/GoogleService-Info.plist
          grep -Fq 'node scripts/audit-app-review-full-access.cjs --require-ready' .github/workflows/ios-appstore-candidate.yml
          echo "No Apple upload, no signing and no Firebase access."
