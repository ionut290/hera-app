name: Verify iOS App Store 2.5.19 native bundle (never deploy)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-review-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare native web assets without Apple reviewer access
        run: |
          node scripts/prepare-capacitor-web.js
          node scripts/check-appstore-2519-clean.js
      - name: Preserve the normal user login and protected core flows
        run: |
          node scripts/check-auth-stability-contract.js
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js
