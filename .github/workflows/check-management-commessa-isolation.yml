name: Check management commessa isolation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  management-commessa-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check runtime syntax
        run: node --check operational-import-repair.js
      - name: Check exact commessa isolation
        run: node scripts/check-management-commessa-isolation.js
      - name: Check full commesse impianti integrity
        run: node scripts/check-commesse-impianti-integrity.js
