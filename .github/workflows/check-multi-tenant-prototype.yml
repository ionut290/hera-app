name: Multi-tenant prototype (local emulator only)
on:
  push:
    branches: ['development/multi-azienda-v2', 'development/multi-azienda-v2-full-app']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    if: github.ref == 'refs/heads/development/multi-azienda-v2' || github.ref == 'refs/heads/development/multi-azienda-v2-full-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check staging client syntax
        run: |
          node --check tests/multi-tenant/staging-client.mjs
          node --check tenant-admin-panel.js
          node --check tenant-company-selector.js
          node --check tenant-signup.js
          node --check functions/multi-tenant/workspace.cjs
          node --check functions/multi-tenant/modules.cjs
          node --check functions/multi-tenant/support-modules.cjs
          node --check functions/multi-tenant/writes.cjs
          node --check functions/multi-tenant/operations.cjs
          node --check functions/multi-tenant/starter-plan.cjs
          node --check functions/multi-tenant/worker-access.cjs
          node --check functions/multi-tenant/worker-hours.cjs
          node --check functions/multi-tenant/hours-review.cjs
          node --check tenant-runtime-session.js
          node --check tests/multi-tenant/legacy-boundary-inventory.cjs
          node --check tests/multi-tenant/flat-path-experiment.test.cjs
          node --check tests/multi-tenant/flat-session-scope.cjs
          node --check tests/multi-tenant/flat-session-runtime.test.cjs
          node --check tests/multi-tenant/flat-session-auth.test.cjs
          node --check tests/multi-tenant/flat-session-monitor.cjs
          node --check tests/multi-tenant/flat-session-archives.test.cjs
          node --check tests/multi-tenant/original-functions.cjs
          node --check tests/multi-tenant/original-write-scope.cjs
          node --check tests/multi-tenant/original-write-quota.test.cjs
          node tests/multi-tenant/tenant-runtime-session.test.cjs
          node --check tests/multi-tenant/original-browser-smoke.cjs
          node --check tests/multi-tenant/legacy-commesse-scope.cjs
          node --check tests/multi-tenant/legacy-commesse-runtime.test.cjs
          node --check tests/multi-tenant/company-http.emulator.cjs
          npm run check:fatto-whazzup-immutable
          npm run check:fatto-isolation
          npm run check:auth-stability
          node --check tests/multi-tenant/staging-bootstrap.cjs
          node -e "const a=require('node:assert/strict');const s=require('./tests/multi-tenant/staging-bootstrap.cjs');a.equal(s.ROOT,'projects/varga-cantieri-v2-staging/databases/(default)/documents');a.deepEqual(s.createWrite('test/x',{synthetic:true}).currentDocument,{exists:false});a.deepEqual(s.fields({synthetic:true,n:1}),{synthetic:{booleanValue:true},n:{integerValue:'1'}});"
          if node tests/multi-tenant/staging-bootstrap.cjs --execute hera-app-6cd2b invalid@example.invalid; then exit 1; fi
      - name: Inventory original runtime boundaries
        run: |
          VARGA_INVENTORY_OUTPUT="$RUNNER_TEMP/varga-boundaries.json" node tests/multi-tenant/legacy-boundary-inventory.cjs
      - name: Upload source boundary inventory
        uses: actions/upload-artifact@v4
        with:
          name: varga-2-legacy-boundaries
          path: ${{ runner.temp }}/varga-boundaries.json
          retention-days: 7
      - name: Install isolated test dependencies
        working-directory: tests/multi-tenant
        run: |
          npm install --no-save --package-lock=false firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14 firebase-admin@13 acorn@8.15.0
      - name: Run Firestore synthetic tenant tests
        working-directory: tests/multi-tenant
        run: |
          npx firebase emulators:exec --only firestore,auth --project demo-varga-multi-tenant --config firebase.emulator.json 'node isolation.test.cjs && node tenant-service.emulator.test.cjs && node auth-adapter.emulator.test.cjs && node legacy-commesse-runtime.test.cjs && node flat-path-experiment.test.cjs && node flat-session-runtime.test.cjs && node flat-session-auth.test.cjs && node flat-session-archives.test.cjs && node original-write-quota.test.cjs'
  original-browser-smoke:
    if: github.ref == 'refs/heads/development/multi-azienda-v2-full-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install original browser SDK and Chromium
        working-directory: tests/multi-tenant
        run: |
          mkdir -p "$RUNNER_TEMP/varga-browser-deps"
          cd "$RUNNER_TEMP/varga-browser-deps"
          printf '{"name":"varga-browser-lab","version":"1.0.0","private":true}\n' > package.json
          npm install --no-save --package-lock=false firebase@12.18.0 firebase-tools@14 firebase-admin@13 playwright@1.58.2 leaflet@1.9.4
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Boot original app against local emulators only
        working-directory: tests/multi-tenant
        run: |
          export VARGA_BROWSER_DEPS="$RUNNER_TEMP/varga-browser-deps/node_modules"
          export NODE_PATH="$VARGA_BROWSER_DEPS"
          "$VARGA_BROWSER_DEPS/.bin/firebase" emulators:exec --only firestore,auth --project demo-varga-multi-tenant --config firebase.emulator.json 'node original-browser-smoke.cjs'
