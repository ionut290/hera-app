name: Check refresh preserves login session

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  refresh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-refresh-preserves-session.js
