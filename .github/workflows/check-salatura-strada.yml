name: Check Salatura Strada integration
on:
  pull_request:
    paths:
      - 'salatura-strada-routes.js'
      - 'salatura-strada-integration.js'
      - 'salatura-strada-integration.css'
      - 'scripts/check-salatura-strada.cjs'
      - 'scripts/check-salatura-unified.cjs'
      - 'scripts/prepare-capacitor-web.js'
      - 'scripts/prepare-netlify-web.cjs'
      - 'scripts/check-netlify-public-build.cjs'
      - 'firestore.rules'
      - 'piano-neve/**'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/check-salatura-strada.yml'
  push:
    branches: [main]
    paths:
      - 'salatura-strada-routes.js'
      - 'salatura-strada-integration.js'
      - 'salatura-strada-integration.css'
      - 'scripts/check-salatura-strada.cjs'
      - 'scripts/check-salatura-unified.cjs'
      - 'scripts/prepare-capacitor-web.js'
      - 'scripts/prepare-netlify-web.cjs'
      - 'scripts/check-netlify-public-build.cjs'
      - 'firestore.rules'
      - 'piano-neve/**'
      - '.github/workflows/check-salatura-strada.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check salatura-strada-routes.js
          node --check salatura-strada-integration.js
          node --check piano-neve/app.js
          node --check piano-neve/snow-auth-bridge.js
      - name: Check normal commesse and safe deep links
        run: node scripts/check-salatura-strada.cjs
      - name: Verify shared Firebase Auth and complete offline GPS road network
        run: node scripts/check-salatura-unified.cjs
      - name: Verify real Netlify production build (including offline Piano Neve)
        run: |
          node scripts/prepare-capacitor-web.js
          node scripts/prepare-netlify-web.cjs
          node scripts/check-netlify-public-build.cjs
      - name: Preserve Castel Maggiore KML snow routing
        run: node scripts/check-snow-castel-maggiore.js
