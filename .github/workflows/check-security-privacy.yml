name: Security and privacy regression
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'privacy.html'
      - 'scripts/check-security-privacy-audit.js'
      - 'package.json'
      - '.github/workflows/check-security-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check security and privacy assertions
        run: npm run check:security-privacy
