name: Check user self-service password recovery (synthetic, NO MAIL)
on:
  pull_request:
    branches: [main]
    paths:
      - "first-login-password.js"
      - "index.html"
      - "sw.js"
      - "scripts/check-first-login-password.js"
      - "scripts/check-self-service-password-reset-runtime.cjs"
      - ".github/workflows/check-self-service-password-reset.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test actual password reset code in isolated fake Firebase runtime
        run: |
          set -euo pipefail
          node --check first-login-password.js
          node --check scripts/check-self-service-password-reset-runtime.cjs
          npm run check:self-service-password-reset
      - name: State safe test boundaries
        run: echo "All email sends are synthetic stubs. No Firebase access, credentials, real reset messages, production changes or TestFlight release."
