name: Coalesce active commesse config read once
on:
  push:
    branches: [opt/coalesce-activecommesse-config-read]
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/coalesce-activecommesse-config-read
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/coalesce-activecommesse-config-read-once.js
      - name: Verify focused checks
        run: |
          node --check active-commesse-first-boot-guard.js
          node --check activity-logs-read-disable.js
          grep -q "getActiveIndexState" active-commesse-first-boot-guard.js
          grep -q "sharedIndexPromise" activity-logs-read-disable.js
          npm run check:done-button
          node scripts/check-critical-flows.js
          npm run check:auth-login
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add active-commesse-first-boot-guard.js activity-logs-read-disable.js
          git commit -m "Coalesce active commesse config read"
          git push origin HEAD:opt/coalesce-activecommesse-config-read
