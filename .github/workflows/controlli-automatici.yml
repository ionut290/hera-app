name: Controlli automatici Hera App

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica-app:
    name: Verifica app e funzioni critiche
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verifica file essenziali
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "app.js"
            "firebase-config.js"
            "sw.js"
            "netlify.toml"
            "manifest.webmanifest"
            "package.json"
            "package-lock.json"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "File essenziale mancante o vuoto: $file"
              exit 1
            fi
          done

          grep -qi '<html' index.html
          grep -qi '<script' index.html

      - name: Installa dipendenze bloccate
        run: npm ci --ignore-scripts

      - name: Verifica sintassi JavaScript critica
        run: npm run check:syntax

      - name: Verifica flusso FATTO, listener e WhatsApp
        run: npm run check:fatto-critical

      - name: Verifica funzioni operative principali
        shell: bash
        run: |
          set -euo pipefail
          npm run check:auth-login
          npm run check:app-update
          npm run check:notifications
          npm run check:calendar
          npm run check:weather
          npm run check:google-sheet-sync

      - name: Verifica JSON e configurazione Netlify
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));"
          python3 - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path('netlify.toml').open('rb') as handle:
              tomllib.load(handle)
          print('netlify.toml valido')
          PY

      - name: Riepilogo
        run: |
          echo "Controlli completati: la Pull Request può essere revisionata."
