name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase-functions.yml"

permissions:
  contents: read

concurrency:
  group: deploy-firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate Firebase functions
        run: node -e "require('./functions/main.js'); console.log('Functions loaded successfully')"

      - name: Prepare approved function entrypoint
        shell: bash
        run: |
          # reportClientError is not in the approved --only list below. Avoid
          # loading its separately managed email secrets during this deploy.
          node <<'NODE'
          const fs = require("node:fs");
          const entrypointPath = "functions/main.js";
          const source = fs.readFileSync(entrypointPath, "utf8");
          const prepared = source
            .replace(/^const errorReportingFunctions = require\("\.\/error-reporting"\);\r?\n/m, "")
            .replace(/^\s*errorReportingFunctions,\r?\n/m, "");

          if (prepared === source || prepared.includes("errorReportingFunctions")) {
            throw new Error("Unable to isolate the approved deploy entrypoint.");
          }

          fs.writeFileSync(entrypointPath, prepared);
          require("./functions/main.js");
          console.log("Approved deploy entrypoint loaded successfully");
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: >-
          firebase deploy
          --only firestore:rules
          --project hera-app-6cd2b
          --non-interactive
          --force

      - name: Deploy approved Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: >-
          firebase deploy
          --only functions:processAdminPasswordPrivateRequest,functions:notifyAndroidChatMessage,functions:notifyAndroidHoursInserted,functions:notifyAndroidSquadraAssignment,functions:syncCalendarAbsenceSquadraAlerts,functions:syncSharedCalendarFromOreReports,functions:syncSharedCalendarFromOreApprovalRequests,functions:syncSharedRegistriesFromPersonale,functions:syncSharedRegistriesFromMezzi,functions:syncSharedSquadreFromHistory,functions:syncSharedSquadreFromCurrent,functions:rebuildAllSharedStaticViews,functions:syncImpiantoChangeIndex,functions:recordClientErrorGroup,functions:getErrorCenterSummary,functions:getErrorCenterDashboard,functions:markErrorCenterSeen,functions:updateErrorCenterStatus,functions:getErrorEmailUsage,functions:uploadWhazzupPdfToDrive,functions:cleanupExpiredWhazzupPdfs
          --project hera-app-6cd2b
          --non-interactive
          --force
