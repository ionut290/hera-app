name: Deploy impianto notification function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-notify-impianto-done
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Function
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Remove incomplete first-generation function
        run: >
          npx --yes firebase-tools@latest functions:delete
          notifyAllUsersWhenImpiantoDone
          --region us-central1
          --project hera-app-6cd2b
          --force

      - name: Deploy notifyAllUsersWhenImpiantoDone
        run: >
          npx --yes firebase-tools@latest deploy
          --only functions:notifyAllUsersWhenImpiantoDone
          --project hera-app-6cd2b
          --non-interactive
          --force
