name: Deploy impianto notification function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-notify-impianto-done
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase Function
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Deploy notifyAllUsersWhenImpiantoDone
        run: >
          npx --yes firebase-tools@latest deploy
          --only functions:notifyAllUsersWhenImpiantoDone
          --project hera-app-6cd2b
          --non-interactive
