name: Deploy registerTester

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/index.js"
      - "functions/package.json"
      - ".github/workflows/deploy-register-tester.yml"

permissions:
  contents: read

concurrency:
  group: deploy-register-tester
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase function
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B is missing."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Prepare registerTester entrypoint
        shell: bash
        run: |
          # reportClientError is unrelated to registerTester. Avoid loading its
          # separately managed RESEND_API_KEY secret during this focused deploy.
          node <<'NODE'
          const fs = require("node:fs");
          const entrypointPath = "functions/main.js";
          const source = fs.readFileSync(entrypointPath, "utf8");
          const prepared = source
            .replace(/^const errorReportingFunctions = require\("\.\/error-reporting"\);\r?\n/m, "")
            .replace(/^\s*errorReportingFunctions,\r?\n/m, "");

          if (prepared === source || prepared.includes("errorReportingFunctions")) {
            throw new Error("Unable to isolate the registerTester deploy entrypoint.");
          }

          fs.writeFileSync(entrypointPath, prepared);
          const exported = require("./functions/main.js");
          if (typeof exported.registerTester !== "function") {
            throw new Error("registerTester is missing from the prepared entrypoint.");
          }
          console.log("registerTester deploy entrypoint loaded successfully");
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy registerTester
        run: firebase deploy --only functions:registerTester --project hera-app-6cd2b --non-interactive
