name: Deploy registerTester

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/index.js"
      - "functions/main.js"
      - "functions/operator-login-register-tester.js"
      - "functions/operator-default-password.js"
      - "functions/package.json"
      - ".github/workflows/deploy-register-tester.yml"

permissions:
  contents: read

concurrency:
  group: deploy-register-tester
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firebase functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B is missing."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate Firebase functions
        run: node -e "require('./functions/main.js'); console.log('Functions loaded successfully')"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy access functions
        run: firebase deploy --only functions:registerTester,functions:setOperatorDefaultPassword --project hera-app-6cd2b --non-interactive
