name: Deploy Firestore rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - ".github/workflows/deploy-self-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy verified-user access rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Deploy Firestore rules
        run: >
          npx --yes firebase-tools@latest deploy
          --only firestore:rules
          --project hera-app-6cd2b
          --non-interactive
