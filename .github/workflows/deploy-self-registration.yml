name: Verify Firestore registration rules (NEVER deploy)

# PRIVACY RELEASE GATE:
# This legacy workflow previously deployed the ENTIRE firestore.rules file
# automatically whenever it changed on main. It must not bypass the manually
# reviewed staged production rollout for private chat, GPS and email queues.
# Deployment is exclusively handled by deploy-firestore-chat-protected.yml.
on:
  pull_request:
    paths:
      - "firestore.rules"
      - "scripts/check-security-privacy-audit.js"
      - ".github/workflows/deploy-self-registration.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - ".github/workflows/deploy-self-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate Firestore security source without credentials or deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate security rules and registration access
        run: |
          set -euo pipefail
          test -s firestore.rules
          node scripts/check-security-privacy-audit.js
          if grep -E 'firebase-tools.*deploy|--only[[:space:]]+firestore:rules' .github/workflows/deploy-self-registration.yml; then
            echo "::error::Legacy workflow must not deploy Firestore rules"; exit 1
          fi
          echo "PASS: registration rules source validated; no production changes"
