name: Diagnose admin password runtime

on:
  push:
    branches:
      - diag/admin-password-runtime

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe callable endpoints
        shell: bash
        run: |
          echo '=== adminSetUserPassword HTTP ==='
          curl -sS -o /tmp/admin-response.txt -w 'HTTP %{http_code}\n' -H 'Content-Type: application/json' -d '{"data":{}}' https://europe-west1-hera-app-6cd2b.cloudfunctions.net/adminSetUserPassword || true
          cat /tmp/admin-response.txt || true
          echo
          echo '=== createTesterAccounts HTTP ==='
          curl -sS -o /tmp/tester-response.txt -w 'HTTP %{http_code}\n' -H 'Content-Type: application/json' -d '{"data":{}}' https://us-central1-hera-app-6cd2b.cloudfunctions.net/createTesterAccounts || true
          cat /tmp/tester-response.txt || true
          echo
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Read recent admin password logs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo '=== adminSetUserPassword ==='
          firebase functions:log --only adminSetUserPassword --project hera-app-6cd2b --lines 100
          echo '=== createTesterAccounts ==='
          firebase functions:log --only createTesterAccounts --project hera-app-6cd2b --lines 100
