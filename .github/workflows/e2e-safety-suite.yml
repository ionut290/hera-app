name: Hera E2E Safety Suite

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "login-retry-fix.js"
      - "pwa-login-force-update.js"
      - "firebase-config.js"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-safety:
    name: E2E login, Google, FATTO e apertura app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa dipendenze del progetto
        run: npm ci --ignore-scripts

      - name: Installa Playwright per il test isolato
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Avvia server locale
        run: |
          python3 -m http.server 8080 > /tmp/hera-e2e-server.log 2>&1 &
          echo $! > /tmp/hera-e2e-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hera-e2e-server.log
          exit 1

      - name: Esegue test resilienza login
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e/login-session.spec.js --browser=chromium --reporter=line

      - name: Esegue test login Google di riserva
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e/google-login.spec.js --browser=chromium --reporter=line

      - name: Esegue apertura app e flusso FATTO
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e/fatto-flow.spec.js --browser=chromium --reporter=line

      - name: Arresta server locale
        if: always()
        run: |
          if [ -f /tmp/hera-e2e-server.pid ]; then
            kill "$(cat /tmp/hera-e2e-server.pid)" 2>/dev/null || true
            rm -f /tmp/hera-e2e-server.pid
          fi

      - name: Carica report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hera-e2e-report
          path: |
            playwright-report/
            test-results/
            /tmp/hera-e2e-server.log
          if-no-files-found: ignore
          retention-days: 7
