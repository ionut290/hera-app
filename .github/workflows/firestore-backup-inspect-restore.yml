name: Firestore Backup Inspect Restore

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect oppure restore"
        required: true
        default: "inspect"
        type: choice
        options:
          - inspect
          - restore
      target_before:
        description: "Seleziona l'ultimo backup creato non dopo questo istante (ISO-8601 UTC)"
        required: true
        default: "2026-08-18T05:00:00Z"
      destination_database:
        description: "Database di destinazione per restore (solo mode=restore)"
        required: false
        default: "hera-restore-20260818-0700"

permissions:
  contents: read

jobs:
  firestore-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write Google service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing secret FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - name: Authenticate gcloud
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project hera-app-6cd2b

      - name: List Firestore backups
        id: backups
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          TARGET_BEFORE: ${{ inputs.target_before }}
        run: |
          set -euo pipefail
          gcloud firestore backups list \
            --project=hera-app-6cd2b \
            --format=json > "$RUNNER_TEMP/firestore-backups.json"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          path = os.path.join(os.environ['RUNNER_TEMP'], 'firestore-backups.json')
          target = datetime.fromisoformat(os.environ['TARGET_BEFORE'].replace('Z', '+00:00'))
          rows = json.load(open(path, encoding='utf-8'))
          eligible = []
          for row in rows:
              ct = row.get('createTime') or row.get('create_time')
              if not ct:
                  continue
              dt = datetime.fromisoformat(ct.replace('Z', '+00:00'))
              if dt <= target:
                  eligible.append((dt, row))
          eligible.sort(key=lambda x: x[0], reverse=True)
          print('Backup disponibili:')
          for dt, row in sorted([(datetime.fromisoformat((r.get('createTime') or '').replace('Z','+00:00')), r) for r in rows if r.get('createTime')], key=lambda x:x[0], reverse=True):
              print(dt.isoformat(), row.get('state'), row.get('name'))
          if not eligible:
              raise SystemExit('Nessun backup disponibile non successivo a ' + os.environ['TARGET_BEFORE'])
          dt, selected = eligible[0]
          name = selected['name']
          print('SELECTED_BACKUP=' + name)
          print('SELECTED_CREATE_TIME=' + dt.isoformat())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('backup_name=' + name + '\n')
              fh.write('backup_create_time=' + dt.isoformat() + '\n')
          PY

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Firestore backup selezionato"
            echo "- Target massimo: ${{ inputs.target_before }}"
            echo "- Backup: \`${{ steps.backups.outputs.backup_name }}\`"
            echo "- Create time: ${{ steps.backups.outputs.backup_create_time }}"
            echo "- Mode: ${{ inputs.mode }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore into isolated database
        if: ${{ inputs.mode == 'restore' }}
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          BACKUP_NAME: ${{ steps.backups.outputs.backup_name }}
          DESTINATION_DATABASE: ${{ inputs.destination_database }}
        run: |
          set -euo pipefail
          if [ -z "$DESTINATION_DATABASE" ] || [ "$DESTINATION_DATABASE" = "(default)" ]; then
            echo "Refusing restore into default database. Use an isolated destination database."
            exit 1
          fi
          gcloud firestore databases restore \
            --source-backup="$BACKUP_NAME" \
            --destination-database="$DESTINATION_DATABASE" \
            --project=hera-app-6cd2b

          echo "Restore avviato/completato verso database isolato: $DESTINATION_DATABASE" >> "$GITHUB_STEP_SUMMARY"
