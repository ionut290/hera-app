name: Fix speed phase 2 test

on:
  push:
    branches:
      - feat/speed-lazy-identity-20260815
    paths:
      - .github/workflows/fix-speed-phase2-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/speed-lazy-identity-20260815
      - name: Update expected cache version only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-no-dead-nested-listener-optimizer.js')
          text = p.read_text()
          old = 'assert.match(sw, /varga-cantieri-shell-v132/);'
          new = 'assert.match(sw, /varga-cantieri-shell-v133/);'
          if old not in text:
              raise SystemExit('old cache expectation not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test-only change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-no-dead-nested-listener-optimizer.js
          git diff --cached --check
          git commit -m "Aggiorna guard cache PWA fase velocità 2"
          git push
