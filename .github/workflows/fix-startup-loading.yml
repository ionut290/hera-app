name: Fix startup Home

on: [push]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git checkout -b automated/startup-home-fix-v2
      - run: python .github/scripts/fix_startup_loading.py
      - run: node --check app.js
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/fix-startup-loading.yml
          rm .github/scripts/fix_startup_loading.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/fix-startup-loading.yml .github/scripts/fix_startup_loading.py
          git commit -m "Sblocca la Home se un listener iniziale è lento"
          git push origin automated/startup-home-fix-v2
          gh pr create --base main --head automated/startup-home-fix-v2 --title "Sblocca caricamento iniziale della Home" --body "Correzione mirata con timeout non bloccante per i listener iniziali e controllo sintattico di app.js."
