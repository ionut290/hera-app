name: Full stable backup 2026-08-19

on:
  push:
    branches:
      - ops/full-backup-2026-08-19
    paths:
      - '.github/workflows/full-backup-2026-08-19.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: full-stable-backup-2026-08-19
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_ID: hera-app-6cd2b
      SOURCE_BUCKET: gs://hera-app-6cd2b.firebasestorage.app
      BACKUP_BUCKET: gs://hera-app-6cd2b-dr-backups-645390631375
      STABLE_CODE_COMMIT: 81ba299a1e4c7fdafdf56c332daa513a89045985
      STABLE_CODE_BRANCH: backup/stable-2026-08-19
      BACKUP_ATTEMPT: diagnostic-2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report backup start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: `▶️ Avviato backup completo VARGA-STABLE-2026-08-19 — run ${context.runId}.`
            });

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Set up gcloud
        id: gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run full backup
        id: backup
        continue-on-error: true
        shell: bash
        run: bash .github/backup/full-backup-2026-08-19.sh

      - name: Diagnose cloud backup blockers
        if: steps.backup.outcome != 'success'
        shell: bash
        run: |
          set +e
          DIR="$RUNNER_TEMP/varga-stable-backup"
          for file in firestore-export.err storage-rsync.err firestore-database.err bucket-create.err; do
            if [ -s "$DIR/$file" ]; then
              echo "::group::$file"
              head -n 80 "$DIR/$file" \
                | sed -E 's/(Bearer|Authorization:)[[:space:]]+[A-Za-z0-9._~+\/-]+/\1 [REDACTED]/g; s/(private_key|client_secret)[^,}]*/\1:[REDACTED]/g'
              echo "::endgroup::"
            fi
          done

      - name: Report backup result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const lines = [
              `### Esito backup completo — run ${context.runId}`,
              '',
              `- Codice stabile: \`${process.env.STABLE_CODE_COMMIT}\``,
              `- Branch stabile: \`${process.env.STABLE_CODE_BRANCH}\``,
              `- Backup job: **${{ steps.backup.outcome }}**`,
              `- Bucket backup: **${{ steps.backup.outputs.bucket_status || 'n/d' }}**`,
              `- Firestore: **${{ steps.backup.outputs.firestore_status || 'n/d' }}**`,
              `- Firebase Storage: **${{ steps.backup.outputs.storage_status || 'n/d' }}**`,
              `- Firebase Authentication: **${{ steps.backup.outputs.auth_status || 'n/d' }}**`,
              `- Realtime Database: **${{ steps.backup.outputs.rtdb_status || 'n/d' }}**`,
              `- Configurazione: **${{ steps.backup.outputs.config_status || 'n/d' }}**`,
              '',
              'I dati e i file di backup restano nel bucket privato; qui viene registrato solo lo stato.'
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: lines.join('\n')
            });

      - name: Fail if complete backup did not succeed
        if: steps.backup.outcome != 'success'
        run: exit 1
