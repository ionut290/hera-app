name: Lazy admin user profiles once

on:
  push:
    branches: [opt/lazy-admin-user-profiles-20260815]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/lazy-admin-user-profiles-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/lazy-admin-user-profiles-once.js
      - name: Verify lazy startup behavior
        run: |
          node --check admin-user-access-tools.js
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('admin-user-access-tools.js', 'utf8');
          if (/\n\s*void enhance\(\);\n\s*installObserver\(\);\n/.test(source)) throw new Error('enhance() non deve partire all’avvio');
          if (source.includes('observer.observe(document.body')) throw new Error('observer globale body ancora presente');
          if (!source.includes('observer.observe(panel')) throw new Error('observer del pannello utenti mancante');
          if (!source.includes('panelActivated = true')) throw new Error('attivazione pannello utenti mancante');
          if (!source.includes('window.setTimeout(activateUserPanel, 120)')) throw new Error('caricamento on-demand sul click mancante');
          console.log('Caricamento profili admin confermato on-demand.');
          NODE
          npm run check:done-button
          npm run check:whatsapp-protection
          node scripts/check-critical-flows.js
          npm run check:auth-login
      - name: Commit runtime change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-user-access-tools.js
          git commit -m "Load admin user profiles only on demand"
          git push origin HEAD:opt/lazy-admin-user-profiles-20260815
