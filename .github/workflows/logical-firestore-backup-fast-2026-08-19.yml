name: Fast logical Firestore backup 2026-08-19

on:
  push:
    branches:
      - ops/full-backup-2026-08-19
    paths:
      - '.github/workflows/logical-firestore-backup-fast-2026-08-19.yml'

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: hera-app-6cd2b
      BACKUP_BUCKET: gs://hera-app-6cd2b-dr-backups-645390631375
      FIRESTORE_BACKUP_COLLECTION_WORKERS: 12
      FIRESTORE_BACKUP_CHILD_WORKERS: 32
      FIRESTORE_BACKUP_PAGE_SIZE: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: `⚡ Avviato backup Firestore logico parallelo — run ${context.runId}.`
            });

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase Admin runtime
        run: npm install --prefix functions --no-audit --no-fund

      - name: Create and store complete logical Firestore snapshot
        id: firestore
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/firestore-logical"
          DEST="$BACKUP_BUCKET/stable-2026-08-19/firestore-logical-fast/run-${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          node .github/backup/firestore-logical-backup.js "$OUT"
          gcloud storage rsync --recursive "$OUT" "$DEST"
          node - "$OUT/manifest.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.appendFileSync(process.argv[3], [
            `document_count=${m.documentCount || 0}`,
            `collection_count=${m.collectionCount || 0}`,
            `max_depth=${m.maxDepth || 0}`,
            `bytes=${m.bytes || 0}`,
            `started_at=${m.startedAt || ''}`,
            `completed_at=${m.completedAt || ''}`
          ].join('\n') + '\n');
          NODE

      - name: Inspect managed Firestore backups
        id: managed
        continue-on-error: true
        shell: bash
        run: |
          set +e
          FILE="$RUNNER_TEMP/managed.json"
          if gcloud firestore backups list --project="$PROJECT_ID" --format=json > "$FILE"; then
            node - "$FILE" "$GITHUB_OUTPUT" <<'NODE'
            const fs = require('fs');
            let rows = [];
            try { rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); } catch (_) {}
            const ready = rows.filter(r => r?.state === 'READY' && (r.snapshotTime || r.snapshot_time))
              .sort((a,b) => String(b.snapshotTime || b.snapshot_time).localeCompare(String(a.snapshotTime || a.snapshot_time)));
            fs.appendFileSync(process.argv[3], `status=${ready.length ? 'available' : 'none'}\ncount=${ready.length}\nlatest_snapshot=${ready[0]?.snapshotTime || ready[0]?.snapshot_time || ''}\n`);
            NODE
          else
            echo "status=inaccessible" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const lines = [
              `### ✅ Firestore protetto — run ${context.runId}`,
              '',
              `- Backup logico completo: **SUCCESS**`,
              `- Documenti: **${{ steps.firestore.outputs.document_count }}**`,
              `- Collezioni: **${{ steps.firestore.outputs.collection_count }}**`,
              `- Profondità massima: **${{ steps.firestore.outputs.max_depth }}**`,
              `- Finestra lettura: **${{ steps.firestore.outputs.started_at }} → ${{ steps.firestore.outputs.completed_at }}**`,
              `- Backup gestiti Google: **${{ steps.managed.outputs.status || 'n/d' }}** (ultimo: ${{ steps.managed.outputs.latest_snapshot || 'n/d' }})`,
              '',
              'Snapshot salvato nel bucket privato di disaster recovery.'
            ];
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1194, body: lines.join('\n') });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: `❌ Backup Firestore logico parallelo fallito — run ${context.runId}.`
            });
