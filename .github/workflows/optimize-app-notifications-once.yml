name: Inspect app notifications target once

on:
  push:
    branches:
      - optimize-app-notifications-reads
    paths:
      - '.github/workflows/optimize-app-notifications-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show exact appNotifications source contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('app.js').read_text(encoding='utf-8')
          needle = 'appNotifications'
          positions = []
          start = 0
          while True:
              idx = text.find(needle, start)
              if idx < 0:
                  break
              positions.append(idx)
              start = idx + len(needle)

          print(f'FOUND {len(positions)} occurrences of {needle!r}')
          if not positions:
              raise SystemExit('No appNotifications occurrence found in current branch app.js')

          for n, idx in enumerate(positions, 1):
              left = max(0, idx - 350)
              right = min(len(text), idx + 900)
              print(f'\n--- OCCURRENCE {n} at byte {idx} ---')
              print(text[left:right].replace('\r', '\\r'))
          PY
