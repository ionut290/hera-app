name: Optimize app notifications once

on:
  push:
    branches:
      - optimize-app-notifications-reads
    paths:
      - '.github/workflows/optimize-app-notifications-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exactly one notification limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = 'unsubscribeGlobalNotifications = db.collection("appNotifications")\n    .orderBy("createdAt", "desc")\n    .limit(40)'
          new = 'unsubscribeGlobalNotifications = db.collection("appNotifications")\n    .orderBy("createdAt", "desc")\n    .limit(10)'
          if text.count(old) != 1:
              raise SystemExit('Safety check failed: target count is not exactly one')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- app.js

      - name: Commit app.js change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          test "$(git diff --cached --name-only)" = "app.js"
          git commit -m 'Reduce app notification listener startup reads'
          git push origin HEAD:optimize-app-notifications-reads
