name: Patch Daily codici A

on:
  push:
    branches:
      - fix/daily-a-codes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-a-codes
          fetch-depth: 0
      - name: Aggiorna rilevamento Daily
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('recommended-plants.js')
          s = p.read_text(encoding='utf-8')
          old = 'hasDaily: equipmentText.includes("DAILY") || equipmentText.includes("IVECO"),'
          new = 'hasDaily: equipmentText.includes("DAILY") || equipmentText.includes("IVECO") || /(?:^|\\s)A\\s*[-_.]?\\s*\\d{1,5}(?:\\s|$)/.test(equipmentText),'
          if old not in s:
              raise SystemExit('Pattern hasDaily non trovato')
          s = s.replace(old, new, 1)
          s = s.replace('installed:true, version:"2.1.0"', 'installed:true, version:"2.1.1"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Rimuovi workflow temporaneo e salva
        run: |
          git rm .github/workflows/patch-daily-a-codes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommended-plants.js
          git commit -m "Riconosci i mezzi A come Daily"
          git push origin HEAD:fix/daily-a-codes
