name: Apply phase 19 unused function cleanup

on:
  push:
    branches:
      - agent/consolidation-phase-19-unused-functions-audit

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove confirmed unused functions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-19-unused-functions-audit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove confirmed unused functions
        run: node scripts/remove-confirmed-unused-functions.js
      - name: Verify syntax
        run: node --check app.js && node --check today-summary-interactions.js && node --check active-commesse-first-boot-guard.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js today-summary-interactions.js active-commesse-first-boot-guard.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove confirmed unused functions"
          git push origin HEAD:agent/consolidation-phase-19-unused-functions-audit
