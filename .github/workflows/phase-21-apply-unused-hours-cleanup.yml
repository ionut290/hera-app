name: Apply phase 21 unused hours cleanup

on:
  push:
    branches:
      - agent/consolidation-phase-21-unused-hours-functions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove phase 21 unused hours functions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-21-unused-hours-functions
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Remove unused hours functions
        run: node scripts/remove-confirmed-unused-hours-functions.js
      - name: Verify hours and critical runtime
        run: |
          node --check app.js
          npm run check:today-summary
          npm run check:calendar
          npm run check:done-button
          node scripts/check-critical-flows.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove phase 21 unused hours functions"
          git push origin HEAD:agent/consolidation-phase-21-unused-hours-functions
