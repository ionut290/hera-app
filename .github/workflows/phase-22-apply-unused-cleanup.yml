name: Apply phase 22 unused cleanup

on:
  push:
    branches:
      - agent/consolidation-phase-22-unused-independent-functions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove phase 22 unused functions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-22-unused-independent-functions
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Remove unused functions
        run: node scripts/remove-phase22-unused-functions.js
      - name: Verify runtime
        run: |
          node --check app.js
          node --check active-commesse-first-boot-guard.js
          npm run check:today-summary
          npm run check:weather
          npm run check:done-button
          node scripts/check-critical-flows.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js active-commesse-first-boot-guard.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove phase 22 unused functions"
          git push origin HEAD:agent/consolidation-phase-22-unused-independent-functions
