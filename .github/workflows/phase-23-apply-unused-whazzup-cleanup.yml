name: Apply phase 23 unused Whazzup cleanup

on:
  push:
    branches:
      - agent/consolidation-phase-23-unused-whazzup-wrappers

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove phase 23 unused Whazzup wrappers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-23-unused-whazzup-wrappers
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Remove unused wrappers
        run: node scripts/remove-phase23-unused-whazzup-wrappers.js
      - name: Verify sensitive runtime
        run: |
          node --check app.js
          npm run check:fatto-critical
          npm run check:android-photo-share
          npm run check:android-camera-capture
          npm run check:photo-notes
          npm run check:whatsapp-protection
          node scripts/check-critical-flows.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove phase 23 unused Whazzup wrappers"
          git push origin HEAD:agent/consolidation-phase-23-unused-whazzup-wrappers
