name: Apply phase 26 pure utils extraction

on:
  push:
    branches:
      - agent/consolidation-phase-26-pure-utils-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract phase 26 pure utilities'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-26-pure-utils-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract pure utilities
        run: node scripts/phase26-extract-pure-utils.js
      - name: Verify modularization
        run: |
          node --check app.js
          node --check app-pure-utils.js
          npm run check:fatto-critical
          npm run check:android-photo-share
          npm run check:android-camera-capture
          npm run check:photo-notes
          npm run check:whatsapp-protection
          npm run check:today-summary
          node scripts/check-critical-flows.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-pure-utils.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract phase 26 pure utilities"
          git push origin HEAD:agent/consolidation-phase-26-pure-utils-module
