name: Phase 30 extract Worklimate module

on:
  push:
    branches:
      - agent/consolidation-phase-30-functional-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract Worklimate module from app.js'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-30-functional-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract Worklimate module
        run: node scripts/phase30-extract-worklimate-module.js
      - name: Verify Worklimate modularization
        run: |
          node --check app.js
          node --check app-worklimate.js
          node --check sw.js
          npm run check:weather
          npm run check:today-summary
          npm run check:fatto-critical
          node scripts/check-critical-flows.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-worklimate.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract Worklimate module from app.js"
          git push origin HEAD:agent/consolidation-phase-30-functional-module
