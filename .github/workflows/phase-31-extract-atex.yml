name: Phase 31 extract ATEX module

on:
  push:
    branches:
      - agent/consolidation-phase-31-atex-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract ATEX module from app.js'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-31-atex-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract ATEX module
        run: node scripts/phase31-extract-atex-module.js
      - name: Verify ATEX modularization
        run: |
          node --check app.js
          node --check app-atex.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const mod = fs.readFileSync('app-atex.js', 'utf8');
          const names = ['renderAtexProcedurePage','saveAtexProcedureForm','openAtexProcedurePage','shouldShowAtexButtonForImpianto','getAtexIllustrationSvg'];
          for (const name of names) {
            if (!mod.includes(`function ${name}`)) throw new Error(`${name} assente dal modulo ATEX`);
            if (app.includes(`function ${name}`)) throw new Error(`${name} ancora dichiarata in app.js`);
          }
          console.log('ATEX module boundary checks passed.');
          NODE
          npm run check:weather
          npm run check:today-summary
          npm run check:fatto-critical
          node scripts/check-critical-flows.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-atex.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract ATEX module from app.js"
          git push origin HEAD:agent/consolidation-phase-31-atex-module
