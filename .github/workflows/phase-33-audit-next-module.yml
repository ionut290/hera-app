name: Phase 33 module audit

on:
  push:
    branches:
      - agent/consolidation-phase-33-next-module

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Audit next module candidates
        run: node scripts/phase33-audit-next-module.js
      - name: Print audit report
        run: cat docs/phase33-next-module-audit.json
