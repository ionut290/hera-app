name: Phase 33 extract Documents module

on:
  push:
    branches:
      - agent/consolidation-phase-33-next-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract Documents module from app.js'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-33-next-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract Documents module
        run: node scripts/phase33-extract-documents-module.js
      - name: Verify Documents modularization
        run: |
          node --check app.js
          node --check app-documents.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const mod = fs.readFileSync('app-documents.js', 'utf8');
          const names = ['renderPosDocuments','savePosDocument','renderPrivateDocsList','savePrivateDocument','openNotificationDocumentViewer'];
          for (const name of names) {
            if (!mod.includes(`function ${name}`)) throw new Error(`${name} assente dal modulo Documenti`);
            if (app.includes(`function ${name}`)) throw new Error(`${name} ancora dichiarata in app.js`);
          }
          for (const name of ['normalizeCommessaDocument','normalizeMezzoDocument','normalizePersonaleDocument','normalizeSquadraStoricoDocument']) {
            if (!app.includes(`function ${name}`)) throw new Error(`${name} è stato spostato per errore`);
          }
          console.log('Documents module boundary checks passed.');
          NODE
          npm run check:fatto-critical
          node scripts/check-critical-flows.js
          node scripts/check-app-module-boundaries.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-documents.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract Documents module from app.js"
          git push origin HEAD:agent/consolidation-phase-33-next-module
