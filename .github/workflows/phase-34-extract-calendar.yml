name: Phase 34 extract Calendar module

on:
  push:
    branches:
      - agent/consolidation-phase-34-calendar-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract Calendar module from app.js'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-34-calendar-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract Calendar module
        run: node scripts/phase34-extract-calendar-module.js
      - name: Verify Calendar modularization
        run: |
          node --check app.js
          node --check app-calendar.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const mod = fs.readFileSync('app-calendar.js', 'utf8');
          const names = ['renderCalendar','saveCalendarEvent','subscribeCalendarEvents','renderNotificationCalendar','applyCalendarAbsenceWarningsToSquadraRows'];
          for (const name of names) {
            if (!mod.includes(`function ${name}`)) throw new Error(`${name} assente dal modulo Calendario`);
            if (app.includes(`function ${name}`)) throw new Error(`${name} ancora dichiarata in app.js`);
          }
          for (const name of ['renderPersonalHoursCalendar','renderFerieDisponibilitaCalendar']) {
            if (!app.includes(`function ${name}`)) throw new Error(`${name} è stato spostato per errore`);
          }
          console.log('Calendar module boundary checks passed.');
          NODE
          npm run check:fatto-critical
          node scripts/check-critical-flows.js
          node scripts/check-app-module-boundaries.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-calendar.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract Calendar module from app.js"
          git push origin HEAD:agent/consolidation-phase-34-calendar-module
