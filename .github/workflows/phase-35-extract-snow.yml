name: Phase 35 extract Snow module

on:
  push:
    branches:
      - agent/consolidation-phase-35-snow-module

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract Snow module from app.js'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidation-phase-35-snow-module
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract Snow module
        run: node scripts/phase35-extract-snow-module.js
      - name: Verify Snow modularization
        run: |
          node --check app.js
          node --check app-snow.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js', 'utf8');
          const mod = fs.readFileSync('app-snow.js', 'utf8');
          const names = ['renderSnowService','renderSnowServiceCommesse','subscribeSnowServiceCollections','saveDrawnSnowRoadPath','openSnowServicePage'];
          for (const name of names) {
            if (!mod.includes(`function ${name}`)) throw new Error(`${name} assente dal modulo Neve`);
            if (app.includes(`function ${name}`)) throw new Error(`${name} ancora dichiarata in app.js`);
          }
          if (!app.includes('function publishGlobalNotificationEvent')) throw new Error('publishGlobalNotificationEvent è stato spostato per errore');
          console.log('Snow module boundary checks passed.');
          NODE
          npm run check:fatto-critical
          node scripts/check-critical-flows.js
          node scripts/check-app-module-boundaries.js
          node scripts/audit-unused-functions.js
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app-snow.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract Snow module from app.js"
          git push origin HEAD:agent/consolidation-phase-35-snow-module
