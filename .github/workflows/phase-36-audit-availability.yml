name: Phase 36 availability audit

on:
  push:
    branches:
      - agent/consolidation-phase-36-availability-module
    paths:
      - app.js
      - scripts/phase36-audit-availability-module.js
      - .github/workflows/phase-36-audit-availability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Audit availability functions
        run: node scripts/phase36-audit-availability-module.js
