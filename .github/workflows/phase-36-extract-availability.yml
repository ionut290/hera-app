name: Phase 36 extract Availability module

on:
  push:
    branches:
      - agent/consolidation-phase-36-availability-module
    paths:
      - scripts/phase36-extract-availability-module.js
      - .github/workflows/phase-36-extract-availability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/consolidation-phase-36-availability-module
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund acorn@8
      - name: Extract Availability module
        run: node scripts/phase36-extract-availability-module.js
      - name: Verify Availability modularization
        run: |
          node --check app.js
          node --check app-availability.js
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const mod = fs.readFileSync('app-availability.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const sw = fs.readFileSync('sw.js','utf8');
          const moved = ['getFerieEligibleOperators','refreshFerieProgrammazioneUi','refreshFerieOperatorOptions','saveFerieCollega','computeDayStats','renderFerieList','renderFerieDisponibilitaCalendar'];
          const protectedCore = ['resetImpianto','deleteImpianto','getReadableFirestoreError','logFirestoreError','enablePushNotifications','programmazioneReminderBadge','renderProgrammazioni'];
          for (const n of moved) {
            if (!mod.includes(`function ${n}`)) throw new Error(`${n} manca dal modulo`);
            if (app.includes(`function ${n}`)) throw new Error(`${n} è rimasta nel core`);
          }
          for (const n of protectedCore) if (!app.includes(`function ${n}`)) throw new Error(`${n} non deve essere spostata`);
          if (!index.includes('app-availability.js')) throw new Error('modulo non caricato da index');
          if (!sw.includes('./app-availability.js')) throw new Error('modulo non incluso nella shell PWA');
          NODE
          npm run check:fatto-critical
          npm run check:calendar
      - name: Commit extraction
        run: |
          git config user.name "ionut290"
          git config user.email "148634773+ionut290@users.noreply.github.com"
          git add app.js app-availability.js index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Extract availability module from app core"
          git push origin HEAD:agent/consolidation-phase-36-availability-module
