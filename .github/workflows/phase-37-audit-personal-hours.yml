name: Phase 37 personal hours audit

on:
  push:
    branches:
      - agent/consolidation-phase-37-personal-hours-audit
    paths:
      - app.js
      - scripts/phase37-audit-personal-hours.js
      - .github/workflows/phase-37-audit-personal-hours.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install parser
        run: npm install --no-save --no-audit --no-fund acorn@8
      - name: Audit personal hours functions
        run: node scripts/phase37-audit-personal-hours.js
