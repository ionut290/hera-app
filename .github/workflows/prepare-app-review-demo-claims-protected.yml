name: App Review demo - protected Auth claims

# Manual only; never deploy or delete accounts.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "DRY_RUN or SET_TWO_CLAIMS_ONLY"
        required: true
        type: choice
        default: DRY_RUN
        options:
          - DRY_RUN
          - SET_TWO_CLAIMS_ONLY
      approval:
        description: "Type APPROVE_ISOLATED_DEMO_CLAIMS_ONLY"
        required: true
        type: string
      reviewed_sha:
        description: "Exact reviewed main SHA"
        required: true
        type: string
      demo_email:
        description: "Exact approved Gmail +varga-demo alias, never a password"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: varga-demo-claims-protected
  cancel-in-progress: false
jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approval == 'APPROVE_ISOLATED_DEMO_CLAIMS_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact reviewed commit, demo identity and environment protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.reviewed_sha }}
          DEMO_EMAIL: ${{ inputs.demo_email }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "ionut290/hera-app" ]] || exit 1
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ && "$APPROVED_SHA" == "$GITHUB_SHA" ]] || {
            echo "::error::Expected exact current main commit"; exit 1;
          }
          EXPECTED=458f589f8bba0bbe8dcc14d2f4e45efc5a5c3b135c2df4530413ebfdf52fa1da
          FOUND="$(printf '%s' "$DEMO_EMAIL" | tr '[:upper:]' '[:lower:]' | sha256sum | cut -d' ' -f1)"
          [[ "$FOUND" == "$EXPECTED" ]] || {
            echo "::error::Only the approved disposable alias may be used"; exit 1;
          }
          RESULT="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/environments/firebase-account-deletion-production")" || exit 1
          printf '%s' "$RESULT" | jq -e \
            '.protection_rules | any(.type == "required_reviewers" and .prevent_self_review == true and ([.reviewers[]?] | length > 0))' >/dev/null || {
              echo "::error::Independent approval required: enable Prevent self-review"; exit 1;
            }
  prepare:
    needs: guard
    if: ${{ needs.guard.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: firebase-account-deletion-production
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.reviewed_sha }}
      - name: Offline guard tests
        env:
          APPROVED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          node --check scripts/prepare-app-review-demo-claims.cjs
          node scripts/prepare-app-review-demo-claims.cjs --self-test
      - name: Install Admin SDK from lockfile
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Validate existing scoped Firebase credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/varga-demo-claims.json"
          python3 - "$RUNNER_TEMP/varga-demo-claims.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf8") as f: data=json.load(f)
          assert data.get("project_id")=="hera-app-6cd2b"
          PY
      - name: Read-only metadata and business-link verification
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/varga-demo-claims.json
          REVIEW_DEMO_EMAIL: ${{ inputs.demo_email }}
          ALLOW_PROTECTED_DEMO_CLAIM_PREPARATION: "1"
        run: node scripts/prepare-app-review-demo-claims.cjs --inspect
      - name: Apply ONLY two custom claims; do not enable or delete account
        if: ${{ inputs.operation == 'SET_TWO_CLAIMS_ONLY' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/varga-demo-claims.json
          REVIEW_DEMO_EMAIL: ${{ inputs.demo_email }}
          ALLOW_PROTECTED_DEMO_CLAIM_PREPARATION: "1"
          ALLOW_DEMO_CLAIM_WRITE: "1"
        run: node scripts/prepare-app-review-demo-claims.cjs --apply
      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/varga-demo-claims.json"
