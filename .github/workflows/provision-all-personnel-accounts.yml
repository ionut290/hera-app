name: Provision all personnel accounts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-all-personnel-accounts.yml"
      - "functions/provision-all-personnel-accounts.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-all-personnel-accounts
  cancel-in-progress: false

jobs:
  provision:
    name: Create or update operator accounts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Provision personnel accounts
        working-directory: functions
        env:
          OPERATOR_DEFAULT_PASSWORD: "12345678"
        run: node provision-all-personnel-accounts.js
