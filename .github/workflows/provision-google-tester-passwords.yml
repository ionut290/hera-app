name: Provision Google tester passwords

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provision-google-tester-passwords.yml"
      - "functions/provision-google-testers.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-google-tester-passwords
  cancel-in-progress: false

jobs:
  provision:
    name: Set temporary tester passwords
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Provision existing Google users
        working-directory: functions
        env:
          TESTER_TEMP_PASSWORD: ${{ secrets.TESTER_TEMP_PASSWORD }}
        run: node provision-google-testers.js
