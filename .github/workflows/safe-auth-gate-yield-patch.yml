name: Safe auth-gate yield patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[SAFE-PATCH] auth-gate longtask 17814qt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_BRANCH: fix/auth-gate-longtask-17814qt
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create patch branch
        run: git switch -c "$PATCH_BRANCH"

      - name: Apply deterministic auth startup yields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text(encoding='utf-8')

          helper_anchor = '''function runDeferredStartupTasks(tasks = []) {'''
          helper = '''function yieldToBrowserDuringStartup() {
            return new Promise((resolve) => {
              const resume = () => setTimeout(resolve, 0);
              if (typeof window.requestAnimationFrame === "function") {
                window.requestAnimationFrame(resume);
              } else {
                resume();
              }
            });
          }

          '''
          if 'function yieldToBrowserDuringStartup()' not in source:
              if helper_anchor not in source:
                  raise SystemExit('Anchor runDeferredStartupTasks non trovato')
              source = source.replace(helper_anchor, helper + helper_anchor, 1)

          anchors = [
              ('operatorPositions = [];', 'operatorPositions = [];\n    await yieldToBrowserDuringStartup();'),
              ('closeCommessaResourceViewer();\n    renderParentCommessaOverview();', 'closeCommessaResourceViewer();\n    await yieldToBrowserDuringStartup();\n    renderParentCommessaOverview();'),
              ('clearMap();\n    lastReadChatAt = null;', 'clearMap();\n    await yieldToBrowserDuringStartup();\n    lastReadChatAt = null;'),
          ]

          changed = 0
          for old, new in anchors:
              if new in source:
                  continue
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Anchor non univoco ({count}): {old[:60]}')
              source = source.replace(old, new, 1)
              changed += 1

          if 'await yieldToBrowserDuringStartup();' not in source:
              raise SystemExit('Nessun yield inserito')

          path.write_text(source, encoding='utf-8')
          print(f'Patch auth-gate applicata; anchor modificati: {changed}')
          PY

      - name: Add regression check
        run: |
          cat > scripts/check-auth-main-thread-yields.js <<'JS'
          const fs = require('fs');
          const source = fs.readFileSync('app.js', 'utf8');

          const required = [
            'function yieldToBrowserDuringStartup()',
            'operatorPositions = [];\n    await yieldToBrowserDuringStartup();',
            'closeCommessaResourceViewer();\n    await yieldToBrowserDuringStartup();\n    renderParentCommessaOverview();',
            'clearMap();\n    await yieldToBrowserDuringStartup();\n    lastReadChatAt = null;',
            'runDeferredStartupTasks(['
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              console.error(`Auth main-thread yield mancante: ${token}`);
              process.exit(1);
            }
          }
          const yieldCount = (source.match(/await yieldToBrowserDuringStartup\(\);/g) || []).length;
          if (yieldCount < 3) {
            console.error(`Yield auth insufficienti: ${yieldCount}`);
            process.exit(1);
          }
          console.log(`Auth startup main-thread yields OK (${yieldCount}).`);
          JS
          node scripts/check-auth-main-thread-yields.js

      - name: Guard immutable FATTO Whazzup perimeter
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          test "$(git hash-object scripts/check-fatto-whazzup-isolation.js)" = "7f2f7f4be8f08ebd65ac69fe21139b7eb601d4d1"
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js

      - name: Run auth and critical safety checks
        run: |
          node --check app.js
          node scripts/check-auth-main-thread-yields.js
          node scripts/check-auth-startup-flow.js
          node scripts/check-auth-profile-recovery.js
          npm run check:syntax
          npm run check:data-safety
          npm run check:commesse-impianti
          npm run check:done-button
          npm run check:whatsapp-protection
          node scripts/check-critical-flows.js

      - name: Verify scoped diff
        run: |
          git diff --check
          git status --short
          CHANGED=$(git diff --name-only | sort)
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'app.js\nscripts/check-auth-main-thread-yields.js'

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ionut290@users.noreply.github.com"
          git add app.js scripts/check-auth-main-thread-yields.js
          git commit -m "fix: yield main thread during auth startup"
          git push origin "$PATCH_BRANCH"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "$PATCH_BRANCH" \
            --draft \
            --title "Riduci freeze del thread principale durante auth-gate" \
            --body "Correzione deterministica per l'evento monitor 17814qt. Inserisce tre yield al browser nel reset/render post-auth senza modificare FATTO/WHAZZUP, schema dati o listener. Tutti i controlli critici previsti dal workflow devono passare prima del push.\n\nCloses #$ISSUE_NUMBER")
          gh issue comment "$ISSUE_NUMBER" --body "✅ Patch deterministica applicata e controlli superati. PR in bozza: $PR_URL"
