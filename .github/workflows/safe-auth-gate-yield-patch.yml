name: Safe auth-gate yield patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[SAFE-PATCH-V5] auth-gate longtask 17814qt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_BRANCH: fix/auth-gate-longtask-17814qt-v5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Capture baseline auth-startup test
        run: |
          set +e
          node scripts/check-auth-startup-flow.js > /tmp/auth-baseline.log 2>&1
          BASE_STATUS=$?
          set -e
          echo "$BASE_STATUS" > /tmp/auth-baseline.status
          cat /tmp/auth-baseline.log
          if [ "$BASE_STATUS" -eq 0 ]; then
            echo "Baseline auth-startup già verde."
          else
            grep -q "La registrazione del Service Worker deve usare la stessa versione del reset cache" /tmp/auth-baseline.log
            grep -q "20260824-commessa-isolation1" /tmp/auth-baseline.log
            grep -q "20260825-notification-push-off1" /tmp/auth-baseline.log
            echo "Baseline: noto mismatch Service Worker/cache, non correlato alla patch auth-gate."
          fi
      - run: git switch -c "$PATCH_BRANCH"

      - name: Apply scoped auth startup yields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          s = path.read_text(encoding='utf-8')
          helper_anchor = 'function runDeferredStartupTasks(tasks = []) {'
          helper = '''function yieldToBrowserDuringStartup() {
            return new Promise((resolve) => {
              const resume = () => setTimeout(resolve, 0);
              if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(resume);
              else resume();
            });
          }

          '''
          if 'function yieldToBrowserDuringStartup()' not in s:
              if s.count(helper_anchor) != 1:
                  raise SystemExit(f'helper anchor count={s.count(helper_anchor)}')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          ready = s.find('console.log("APP READY")')
          if ready < 0:
              ready = s.find("console.log('APP READY')")
          if ready < 0:
              raise SystemExit('APP READY marker non trovato')
          auth_pos = s.rfind('onAuthStateChanged', 0, ready)
          if auth_pos < 0:
              raise SystemExit('onAuthStateChanged marker non trovato prima di APP READY')
          block = s[auth_pos:ready]
          for token in ['operatorPositions = [];', 'closeCommessaResourceViewer();', 'clearMap();']:
              if block.count(token) != 1:
                  raise SystemExit(f'auth block token count={block.count(token)}: {token}')
          prefix = s[max(0, auth_pos - 120):auth_pos + 240]
          if 'async' not in prefix:
              raise SystemExit('callback auth non riconosciuto come async; patch annullata')
          block = block.replace('operatorPositions = [];', 'operatorPositions = [];\n    await yieldToBrowserDuringStartup();', 1)
          block = block.replace('closeCommessaResourceViewer();', 'closeCommessaResourceViewer();\n    await yieldToBrowserDuringStartup();', 1)
          block = block.replace('clearMap();', 'clearMap();\n    await yieldToBrowserDuringStartup();', 1)
          s = s[:auth_pos] + block + s[ready:]
          if s.count('await yieldToBrowserDuringStartup();') != 3:
              raise SystemExit('numero yield inatteso dopo patch')
          path.write_text(s, encoding='utf-8')
          print(f'Auth block scoped: {auth_pos}-{ready}; 3 yield applicati')
          PY

      - name: Add regression test
        run: |
          cat > scripts/check-auth-main-thread-yields.js <<'JS'
          const fs = require('fs');
          const s = fs.readFileSync('app.js', 'utf8');
          if (!s.includes('function yieldToBrowserDuringStartup()')) process.exit(1);
          let ready = s.indexOf('console.log("APP READY")');
          if (ready < 0) ready = s.indexOf("console.log('APP READY')");
          if (ready < 0) process.exit(1);
          const auth = s.lastIndexOf('onAuthStateChanged', ready);
          if (auth < 0) process.exit(1);
          const block = s.slice(auth, ready);
          if ((block.match(/await yieldToBrowserDuringStartup\(\);/g) || []).length !== 3) process.exit(1);
          for (const token of ['operatorPositions = [];', 'closeCommessaResourceViewer();', 'clearMap();']) {
            if (!block.includes(token)) process.exit(1);
          }
          console.log('Auth startup scoped yields OK');
          JS

      - name: Immutable FATTO Whazzup guards
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          test "$(git hash-object scripts/check-fatto-whazzup-isolation.js)" = "7f2f7f4be8f08ebd65ac69fe21139b7eb601d4d1"
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js

      - name: Verify auth-startup test did not regress
        run: |
          set +e
          node scripts/check-auth-startup-flow.js > /tmp/auth-patched.log 2>&1
          PATCH_STATUS=$?
          set -e
          BASE_STATUS=$(cat /tmp/auth-baseline.status)
          cat /tmp/auth-patched.log
          test "$PATCH_STATUS" = "$BASE_STATUS"
          if [ "$BASE_STATUS" -ne 0 ]; then
            grep -q "La registrazione del Service Worker deve usare la stessa versione del reset cache" /tmp/auth-patched.log
            grep -q "20260824-commessa-isolation1" /tmp/auth-patched.log
            grep -q "20260825-notification-push-off1" /tmp/auth-patched.log
          fi
          echo "Auth-startup: nessuna regressione rispetto alla baseline."

      - name: Remaining critical checks
        run: |
          node --check app.js
          node scripts/check-auth-main-thread-yields.js
          node scripts/check-auth-profile-recovery.js
          npm run check:syntax
          npm run check:data-safety
          npm run check:commesse-impianti
          npm run check:done-button
          npm run check:whatsapp-protection
          node scripts/check-critical-flows.js

      - name: Scope guard
        run: |
          git diff --check
          CHANGED=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort )
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'app.js\nscripts/check-auth-main-thread-yields.js'

      - name: Commit, push and PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/check-auth-main-thread-yields.js
          git commit -m "fix: yield main thread during auth startup"
          git push origin "$PATCH_BRANCH"
          PR_URL=$(gh pr create --base main --head "$PATCH_BRANCH" --draft --title "Riduci freeze del thread principale durante auth-gate" --body "Patch mirata per 17814qt: tre yield nel solo blocco onAuthStateChanged -> APP READY. Nessuna modifica a FATTO/WHAZZUP, schema dati o listener. Il test auth-startup ha lo stesso mismatch Service Worker/cache già presente in main; tutti gli altri controlli critici richiesti sono passati.\n\nCloses #$ISSUE_NUMBER")
          gh issue comment "$ISSUE_NUMBER" --body "✅ Patch V5 e controlli completati: $PR_URL"
