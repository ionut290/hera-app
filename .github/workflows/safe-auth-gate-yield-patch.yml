name: Safe auth-gate yield patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[SAFE-PATCH-V2] auth-gate longtask 17814qt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PATCH_BRANCH: fix/auth-gate-longtask-17814qt-v2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: git switch -c "$PATCH_BRANCH"

      - name: Apply deterministic auth startup yields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          s = path.read_text(encoding='utf-8')

          helper_anchor = 'function runDeferredStartupTasks(tasks = []) {'
          helper = '''function yieldToBrowserDuringStartup() {
            return new Promise((resolve) => {
              const resume = () => setTimeout(resolve, 0);
              if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(resume);
              else resume();
            });
          }

          '''
          if 'function yieldToBrowserDuringStartup()' not in s:
              if s.count(helper_anchor) != 1:
                  raise SystemExit(f'helper anchor count={s.count(helper_anchor)}')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          replacements = [
            (
              'gpsUpdateRequests = [];\n    operatorPositions = [];\n    hoursApprovalRequests = [];',
              'gpsUpdateRequests = [];\n    operatorPositions = [];\n    await yieldToBrowserDuringStartup();\n    hoursApprovalRequests = [];'
            ),
            (
              'renderResourceButtonsForCommessa();\n    closeCommessaResourceViewer();\n    renderParentCommessaOverview();',
              'renderResourceButtonsForCommessa();\n    closeCommessaResourceViewer();\n    await yieldToBrowserDuringStartup();\n    renderParentCommessaOverview();'
            ),
            (
              'clearMap();\n    lastReadChatAt = null;\n    resetDriveState();',
              'clearMap();\n    await yieldToBrowserDuringStartup();\n    lastReadChatAt = null;\n    resetDriveState();'
            ),
          ]

          for old, new in replacements:
              if new in s:
                  continue
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'auth anchor count={count}: {old[:70]}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          print('Auth startup yields applied')
          PY

      - name: Add regression test
        run: |
          cat > scripts/check-auth-main-thread-yields.js <<'JS'
          const fs = require('fs');
          const s = fs.readFileSync('app.js', 'utf8');
          const required = [
            'function yieldToBrowserDuringStartup()',
            'gpsUpdateRequests = [];\n    operatorPositions = [];\n    await yieldToBrowserDuringStartup();\n    hoursApprovalRequests = [];',
            'closeCommessaResourceViewer();\n    await yieldToBrowserDuringStartup();\n    renderParentCommessaOverview();',
            'clearMap();\n    await yieldToBrowserDuringStartup();\n    lastReadChatAt = null;'
          ];
          for (const token of required) if (!s.includes(token)) process.exit(1);
          if ((s.match(/await yieldToBrowserDuringStartup\(\);/g) || []).length < 3) process.exit(1);
          console.log('Auth startup yields OK');
          JS

      - name: Immutable FATTO Whazzup guards
        run: |
          test "$(git hash-object scripts/check-fatto-whazzup-immutable.js)" = "982c5015da3590311fb52d4395e13387f3f2958e"
          test "$(git hash-object scripts/check-fatto-whazzup-isolation.js)" = "7f2f7f4be8f08ebd65ac69fe21139b7eb601d4d1"
          node scripts/check-fatto-whazzup-immutable.js
          node scripts/check-fatto-whazzup-isolation.js

      - name: Critical checks
        run: |
          node --check app.js
          node scripts/check-auth-main-thread-yields.js
          node scripts/check-auth-startup-flow.js
          node scripts/check-auth-profile-recovery.js
          npm run check:syntax
          npm run check:data-safety
          npm run check:commesse-impianti
          npm run check:done-button
          npm run check:whatsapp-protection
          node scripts/check-critical-flows.js

      - name: Scope guard
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'app.js\nscripts/check-auth-main-thread-yields.js'

      - name: Commit, push and PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/check-auth-main-thread-yields.js
          git commit -m "fix: yield main thread during auth startup"
          git push origin "$PATCH_BRANCH"
          PR_URL=$(gh pr create --base main --head "$PATCH_BRANCH" --draft --title "Riduci freeze del thread principale durante auth-gate" --body "Patch mirata per 17814qt: tre yield durante il reset/render post-auth. Nessuna modifica a FATTO/WHAZZUP, schema dati o listener. Tutti i controlli critici del workflow sono passati.\n\nCloses #$ISSUE_NUMBER")
          gh issue comment "$ISSUE_NUMBER" --body "✅ Patch e controlli completati: $PR_URL"
