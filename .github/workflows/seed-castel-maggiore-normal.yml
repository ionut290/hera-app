name: Import Castel Maggiore normal commesse (one-time guarded)
on:
  push:
    branches: [main]
    paths:
      - "scripts/seed-castel-maggiore-normal.cjs"
      - ".github/workflows/seed-castel-maggiore-normal.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snow-castel-maggiore-normal-commesse-import
  cancel-in-progress: false
jobs:
  import-normal-commesse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved normal-commessa code
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog and JS before production access
        run: |
          node --check scripts/seed-castel-maggiore-normal.cjs
          node scripts/seed-castel-maggiore-normal.cjs --validate
          node scripts/check-snow-castel-maggiore.js
      - name: Install pinned Firebase Admin SDK
        run: npm ci --prefix functions --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}
      - name: Create or reuse 3 normal commesse and 45 stops
        env:
          CONFIRM_NORMAL_SNOW_SEED: IMPORTA-3-COMMESSE-NORMALI
          GOOGLE_CLOUD_PROJECT: hera-app-6cd2b
        run: node scripts/seed-castel-maggiore-normal.cjs --execute
