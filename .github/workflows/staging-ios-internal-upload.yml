name: Varga Cantieri 2.0 internal login-only TestFlight (approval required)
on:
  push:
    branches: [varga-cantieri-v2-staging]
    paths:
      - '.github/workflows/staging-ios-internal-upload.yml'
      - 'staging/portal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    # Verify both read-only Apple API requests before any signing secret is available.
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_validate_ios_profile.py test_prepare_v2_export.py test_prepare_v2_internal_upload.py
        working-directory: staging
      - run: node --test staging/apple-staging-preflight.test.mjs staging/fetch-v2-appstore-profile.test.cjs
  sign:
    needs: checks
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging' && vars.VARGA_V2_INTERNAL_UPLOAD_READY == 'true'
    environment: ios-internal-testflight
    runs-on: macos-26
    timeout-minutes: 45
    concurrency:
      group: varga-v2-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: staging/portal
      - run: npm install --no-save --package-lock=false --no-audit --no-fund leaflet@1.9.4
        working-directory: staging/portal
      - name: Build isolated login-only staging package
        working-directory: staging/portal
        env:
          VARGA_STAGING_WEB_API_KEY: ${{ vars.VARGA_STAGING_WEB_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$VARGA_STAGING_WEB_API_KEY"
          echo "::add-mask::$VARGA_STAGING_WEB_API_KEY"
          node build-full-runtime.mjs private-staging
          test -s private-staging-dist/PRIVATE_STAGING_NOT_RELEASED.txt
          test ! -e private-staging-dist/LOCAL_TEST_ONLY.txt
      - name: Generate independent native app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/varga-v2-signed"
          cp -R staging/portal/private-staging-dist "$RUNNER_TEMP/varga-v2-signed/www"
          cd "$RUNNER_TEMP/varga-v2-signed"
          printf '%s' '{"name":"varga-v2-staging","version":"1.0.0","private":true}' > package.json
          npm install --no-audit --no-fund @capacitor/cli@7.6.10 @capacitor/core@7.6.10 @capacitor/ios@7.6.10
          printf '%s' '{"appId":"it.vargacantieri.staging","appName":"Varga Cantieri 2.0","webDir":"www"}' > capacitor.config.json
          npx cap add ios
          npx cap sync ios
          swift "$GITHUB_WORKSPACE/scripts/prepare-ios-app-icon.swift" "$GITHUB_WORKSPACE/icons/varga-cantieri-512.png" ios/App/App/Assets.xcassets/AppIcon.appiconset
      - name: Import team distribution certificate and fetch only exact V2 profile privately
        env:
          V2_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          V2_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for n in V2_P12 V2_PASSWORD IOS_APPSTORE_KEY_ID IOS_APPSTORE_ISSUER_ID IOS_APPSTORE_PRIVATE_KEY_BASE64; do
            test -n "${!n:-}" || { echo "::error::Missing approved team signing secret: $n"; exit 1; }
          done
          P="$RUNNER_TEMP/varga-v2-signing"
          mkdir -p "$P"
          printf '%s' "$V2_P12" | base64 --decode > "$P/cert.p12"
          node staging/fetch-v2-appstore-profile.cjs "$P/profile.mobileprovision"
          security cms -D -i "$P/profile.mobileprovision" > "$P/profile.plist"
          openssl pkcs12 -in "$P/cert.p12" -clcerts -nokeys -passin env:V2_PASSWORD -out "$P/leaf.pem"
          openssl x509 -in "$P/leaf.pem" -noout -subject | grep -F 'Apple Distribution:' >/dev/null
          openssl x509 -in "$P/leaf.pem" -outform DER -out "$P/leaf.der"
          python3 staging/validate_ios_profile.py "$P/profile.plist" "$P/leaf.der"
          KEYCHAIN="$P/signing.keychain-db"
          KPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KPASS"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          security import "$P/cert.p12" -P "$V2_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F 'Apple Distribution:' >/dev/null
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$P/profile.plist")"
          cp "$P/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      - name: Archive exact V2 app only (no upload)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/varga-v2-signed"
          ruby -r xcodeproj -e 'p=Xcodeproj::Project.open("ios/App/App.xcodeproj"); t=p.targets.find{|x|x.name=="App"}; abort "No App target" unless t; c=t.build_configurations.find{|x|x.name=="Release"}; abort "No Release configuration" unless c; c.build_settings.merge!({"PRODUCT_BUNDLE_IDENTIFIER"=>"it.vargacantieri.staging","DEVELOPMENT_TEAM"=>"NJ64236Q54","CODE_SIGN_STYLE"=>"Manual","CODE_SIGN_IDENTITY"=>"Apple Distribution","PROVISIONING_PROFILE_SPECIFIER"=>"Varga Cantieri 2 Staging TestFlight","MARKETING_VERSION"=>"1.0","CURRENT_PROJECT_VERSION"=>ENV.fetch("GITHUB_RUN_NUMBER")}); p.save'
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VargaV2.xcarchive" archive
          APP="$RUNNER_TEMP/VargaV2.xcarchive/Products/Applications/App.app"
          test -s "$APP/App"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx it.vargacantieri.staging
          test -s "$APP/public/PRIVATE_STAGING_NOT_RELEASED.txt"
          test ! -e "$APP/public/LOCAL_TEST_ONLY.txt"
          test ! -e "$APP/GoogleService-Info.plist"
          codesign --verify --deep --strict "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/varga-v2-signing/embedded.plist"
          python3 "$GITHUB_WORKSPACE/staging/validate_ios_profile.py" "$RUNNER_TEMP/varga-v2-signing/embedded.plist" "$RUNNER_TEMP/varga-v2-signing/leaf.der"
          echo 'V2 signed staging archive validated. Login-only candidate; not uploaded or released.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export and verify local V2 IPA (no Apple upload)
        run: |
          set -euo pipefail
          umask 077
          python3 staging/prepare_v2_export.py "$RUNNER_TEMP/VargaV2ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VargaV2.xcarchive" -exportPath "$RUNNER_TEMP/VargaV2LocalExport" -exportOptionsPlist "$RUNNER_TEMP/VargaV2ExportOptions.plist"
          shopt -s nullglob
          IPAS=("$RUNNER_TEMP/VargaV2LocalExport/"*.ipa)
          test "${#IPAS[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/VargaV2Unpacked"
          ditto -x -k "${IPAS[0]}" "$RUNNER_TEMP/VargaV2Unpacked"
          APPS=("$RUNNER_TEMP/VargaV2Unpacked/Payload/"*.app)
          test "${#APPS[@]}" -eq 1
          APP="${APPS[0]}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx it.vargacantieri.staging
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx "$GITHUB_RUN_NUMBER"
          test -s "$APP/public/PRIVATE_STAGING_NOT_RELEASED.txt"
          test ! -e "$APP/public/LOCAL_TEST_ONLY.txt"
          test ! -e "$APP/GoogleService-Info.plist"
          codesign --verify --deep --strict "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/varga-v2-signing/exported.plist"
          python3 staging/validate_ios_profile.py "$RUNNER_TEMP/varga-v2-signing/exported.plist" "$RUNNER_TEMP/varga-v2-signing/leaf.der"
          echo 'V2 local IPA export validated. No Apple upload; operational functionality still gated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ONLY V2 internal TestFlight login candidate
        env:
          V2_INTERNAL_UPLOAD_READY: ${{ vars.VARGA_V2_INTERNAL_UPLOAD_READY }}
          IOS_APPSTORE_KEY_ID: ${{ secrets.IOS_APPSTORE_KEY_ID }}
          IOS_APPSTORE_ISSUER_ID: ${{ secrets.IOS_APPSTORE_ISSUER_ID }}
          IOS_APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.IOS_APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test "$V2_INTERNAL_UPLOAD_READY" = true
          test "$GITHUB_REF" = refs/heads/varga-cantieri-v2-staging
          APP="$RUNNER_TEMP/VargaV2.xcarchive/Products/Applications/App.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx it.vargacantieri.staging
          test -s "$APP/public/PRIVATE_STAGING_NOT_RELEASED.txt"
          test ! -e "$APP/public/LOCAL_TEST_ONLY.txt"
          test ! -e "$APP/GoogleService-Info.plist"
          codesign --verify --deep --strict "$APP"
          python3 staging/prepare_v2_internal_upload.py "$RUNNER_TEMP/VargaV2InternalUploadOptions.plist"
          KEY_DIR="$RUNNER_TEMP/varga-v2-signing/api-key"
          mkdir -p "$KEY_DIR"
          [[ "$IOS_APPSTORE_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]
          KEY_PATH="$KEY_DIR/AuthKey_$IOS_APPSTORE_KEY_ID.p8"
          printf '%s' "$IOS_APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VargaV2.xcarchive" -exportPath "$RUNNER_TEMP/VargaV2InternalUpload" -exportOptionsPlist "$RUNNER_TEMP/VargaV2InternalUploadOptions.plist" -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$IOS_APPSTORE_KEY_ID" -authenticationKeyIssuerID "$IOS_APPSTORE_ISSUER_ID" > "$RUNNER_TEMP/varga-v2-signing/upload.log" 2>&1 || { echo "::error::V2 internal upload failed. Verify App Store Connect build history before retrying."; exit 1; }
          echo 'Apple upload command succeeded for the internal-only V2 login candidate. Apple processing and installation still require verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/varga-v2-signing/signing.keychain-db" 2>/dev/null || true
          if [[ -n "${V2_PROFILE_UUID:-}" ]]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$V2_PROFILE_UUID.mobileprovision"; fi
          rm -rf "$RUNNER_TEMP/varga-v2-signing" "$RUNNER_TEMP/VargaV2.xcarchive" "$RUNNER_TEMP/VargaV2LocalExport" "$RUNNER_TEMP/VargaV2Unpacked" "$RUNNER_TEMP/VargaV2ExportOptions.plist" "$RUNNER_TEMP/VargaV2InternalUploadOptions.plist" "$RUNNER_TEMP/VargaV2InternalUpload"
