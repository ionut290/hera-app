name: Staging unit tests
on:
  push:
    branches: [varga-cantieri-v2-staging]
    paths: ['staging/**', '.github/workflows/staging-unit-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test staging/*.test.mjs
  portal-build:
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: staging/portal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: compile-only-placeholder
  firestore-emulator:
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated emulator
        working-directory: staging
        run: |
          printf '%s' '{"name":"varga-emulator-ci","version":"1.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund firebase@13.4.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.34.2
          python3 -c "from pathlib import Path; b=Path('firestore-emulator-base.rules').read_text(); assert b.count('// VERDE_FRAGMENT')==1; Path('candidate.rules').write_text(b.replace('// VERDE_FRAGMENT',Path('verde-levato-readonly.rules.fragment').read_text()+'\n'+Path('commesse-readonly.rules.fragment').read_text()+'\n'+Path('commesse-write.rules.fragment').read_text()+'\n'+Path('original-create.rules.fragment').read_text()+'\n'+Path('fatto-policy.rules.fragment').read_text()+'\n'+Path('cobo-write.rules.fragment').read_text()))"
          printf '%s' '{"firestore":{"rules":"candidate.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}' > emulator-ci.json
      - name: Test tenant isolation
        working-directory: staging
        run: npx --no-install firebase emulators:exec --config emulator-ci.json --only firestore --project demo-varga-verde-isolation 'node test-shared-isolation.cjs candidate.rules && node test-fatto-policy.cjs candidate.rules && node test-cobo-write.cjs candidate.rules && node test-commesse-write.cjs candidate.rules && node test-original-create.cjs candidate.rules'
