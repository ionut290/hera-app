name: Staging unit tests
on:
  push:
    branches: [varga-cantieri-v2-staging]
    paths: ['staging/**', '.github/workflows/staging-unit-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    if: github.ref == 'refs/heads/varga-cantieri-v2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test staging/*.test.mjs
