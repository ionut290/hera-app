name: TEMP append impianti listener lifecycle guard

on:
  push:
    branches:
      - feat/impianti-listener-dedupe-20260815

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/impianti-listener-dedupe-20260815
      - name: Append safe listener guard
        env:
          GUARD_B64: 
        run: |
          python -c 'import base64,os; from pathlib import Path; p=Path("commessa-navigation-repair.js"); s=p.read_text(encoding="utf-8"); marker="HeraImpiantiListenerLifecycleGuard"; p.write_text(s if marker in s else s+base64.b64decode(os.environ["GUARD_B64"]).decode("utf-8"), encoding="utf-8")'
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commessa-navigation-repair.js
          git diff --cached --quiet && exit 0
          git commit -m "Deduplicate immediate impianti listener restart"
          git push
