name: TEMP move stats cache before light startup

on:
  push:
    branches:
      - feat/cache-incremental-audit-20260815

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-incremental-audit-20260815
      - name: Move optimizer after app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="commessa-stats-cache-optimizer.js?v=20260815a"></script>\n'
          s = s.replace(tag, '')
          anchor = '  <script src="app.js?v=20260813-render-gate1"></script>\n'
          if anchor not in s:
              raise SystemExit('app.js anchor not found')
          s = s.replace(anchor, anchor + tag, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit move
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load stats cache before Light Startup"
          git push
