name: TEMP wire stats cache optimizer

on:
  push:
    branches:
      - feat/cache-incremental-audit-20260815

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-incremental-audit-20260815
      - name: Insert optimizer before navigation repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="commessa-stats-cache-optimizer.js?v=20260815a"></script>\n'
          anchor = '  <script src="commessa-navigation-repair.js?v=20260812a"></script>\n'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s = s.replace(anchor, tag + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated wiring
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire incremental commessa stats cache"
          git push
