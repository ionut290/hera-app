name: Temporary patch commesse impianti CI

on:
  push:
    branches:
      - agent/audit-commesse-impianti-safe-20260819

permissions:
  contents: write

jobs:
  patch-cache-alignment:
    if: github.event.head_commit.message == 'Aggiungi patch automatica coerenza cache'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-commesse-impianti-safe-20260819
          fetch-depth: 0

      - name: Align PWA assets and remove stale test versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = "20260819-commesse-impianti-safe-v4"

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace(
              'operational-import-repair.js?v=20260728a',
              f'operational-import-repair.js?v={version}'
          )
          index = index.replace(
              'navigator.serviceWorker.register("./sw.js?v=20260814-loading-humor1", { updateViaCache: "none" })',
              f'navigator.serviceWorker.register("./sw.js?v={version}", {{ updateViaCache: "none" }})'
          )
          index_path.write_text(index, encoding="utf-8")

          sw_path = Path("sw.js")
          sw = sw_path.read_text(encoding="utf-8")
          sw = sw.replace(
              'const CACHE_RESET_VERSION = "20260819-inrete-modena-v3";',
              f'const CACHE_RESET_VERSION = "{version}";'
          )
          sw = sw.replace(
              './operational-import-repair.js?v=20260819-modena3',
              f'./operational-import-repair.js?v={version}'
          )
          sw_path.write_text(sw, encoding="utf-8")

          auth_path = Path("scripts/check-auth-startup-flow.js")
          auth = auth_path.read_text(encoding="utf-8")
          auth = auth.replace(
              'assert.match(sw, /varga-cantieri-shell-v133/);\n'
              'assert.match(sw, /CACHE_RESET_VERSION = "20260814-loading-humor1"/);',
              'assert.match(sw, /const CACHE_NAME = "varga-cantieri-shell-v\\d+";/);\n'
              'assert.match(sw, /const CACHE_RESET_VERSION = "[^"]+";/);'
          )
          auth_path.write_text(auth, encoding="utf-8")

          dead_path = Path("scripts/check-no-dead-nested-listener-optimizer.js")
          dead = dead_path.read_text(encoding="utf-8")
          dead = dead.replace(
              'assert.match(sw, /varga-cantieri-shell-v133/);',
              'assert.match(sw, /const CACHE_NAME = "varga-cantieri-shell-v\\d+";/);'
          )
          dead_path.write_text(dead, encoding="utf-8")
          PY

          node scripts/sync-service-worker-assets.js

      - name: Verify focused fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check operational-import-repair.js
          node scripts/check-operational-import-safety.js
          node scripts/check-auth-startup-flow.js
          node scripts/check-no-dead-nested-listener-optimizer.js
          node scripts/check-app-update.js
          git diff --check

      - name: Commit and push alignment
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js scripts/check-auth-startup-flow.js scripts/check-no-dead-nested-listener-optimizer.js
          git commit -m "Allinea cache e distribuzione correzione commesse impianti"
          git push origin HEAD:agent/audit-commesse-impianti-safe-20260819
