name: Test Android virtual device

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "capacitor.config.json"
      - "android/**"
      - "android-resources/**"
      - ".github/workflows/test-android-emulator.yml"

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android debug app
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          npm run android:aab:prepare
          rm -rf "$RUNNER_TEMP/hera-native-android"
          mkdir -p "$RUNNER_TEMP/hera-native-android"
          cp -R android/app/src/main/java "$RUNNER_TEMP/hera-native-android/java"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/hera-native-android/AndroidManifest.xml"
          cp android/app/capacitor.build.gradle "$RUNNER_TEMP/hera-native-android/capacitor.build.gradle"
          rm -rf android
          npx cap add android
          rm -rf android/app/src/main/java
          cp -R "$RUNNER_TEMP/hera-native-android/java" android/app/src/main/java
          cp "$RUNNER_TEMP/hera-native-android/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          test -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64"
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/variables.gradle")
          s=p.read_text()
          if "rgcfaIncludeGoogle = true" not in s:
              s=s.replace("ext {\n","ext {\n    rgcfaIncludeGoogle = true\n",1)
          s=s.replace("compileSdkVersion = 35","compileSdkVersion = 36")
          s=s.replace("targetSdkVersion = 35","targetSdkVersion = 36")
          p.write_text(s)
          PY
          npx cap sync android
          printf '\n// Integrazioni native Hera\n' >> android/app/capacitor.build.gradle
          cat "$RUNNER_TEMP/hera-native-android/capacitor.build.gradle" >> android/app/capacitor.build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop it.vargacantieri.hera
            adb shell monkey -p it.vargacantieri.hera -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell dumpsys window windows | grep -q "it.vargacantieri.hera"
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            adb exec-out screencap -p > android-emulator.png
            ! grep -Eqi "has stopped|keeps stopping|isn't responding" window.xml
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-${{ github.run_number }}
          path: |
            android-emulator.png
            window.xml
          if-no-files-found: warn
          retention-days: 14
