name: TMP speed lazy heavy libs
on:
  push:
    branches: [feat/speed-lazy-heavy-libs-20260815]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/speed-lazy-heavy-libs-20260815
      - name: Apply safe lazy loading
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          heavy = [
              '  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>\n',
              '  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>\n',
              '  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>\n',
              '  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>\n',
          ]
          for line in heavy:
              if line not in text:
                  raise SystemExit(f'Missing expected heavy library tag: {line.strip()}')
              text = text.replace(line, '', 1)
          marker = '  <script src="firebase-config.js"></script>\n'
          lazy = '  <script src="heavy-libs-lazy-loader.js?v=20260815a"></script>\n'
          if marker not in text:
              raise SystemExit('firebase-config marker missing')
          text = text.replace(marker, lazy + marker, 1)
          index.write_text(text)

          sw = Path('sw.js')
          sw_text = sw.read_text()
          marker = '  "./app.js?v=20260813-render-gate1",\n'
          lazy_asset = '  "./heavy-libs-lazy-loader.js?v=20260815a",\n'
          if lazy_asset not in sw_text:
              if marker not in sw_text:
                  raise SystemExit('sw app.js marker missing')
              sw_text = sw_text.replace(marker, marker + lazy_asset, 1)
          sw.write_text(sw_text)

          hours = Path('hours-export-range.js')
          hours_text = hours.read_text()
          old = '  if (!window.ExcelJS?.Workbook) {\n    alert("Libreria Excel non disponibile. Ricarica la pagina e riprova.");\n    return;\n  }\n\n  try {'
          new = '  if (!window.ExcelJS?.Workbook && window.HeraHeavyLibs?.ensure) {\n    try { await window.HeraHeavyLibs.ensure("exceljs"); } catch (_) {}\n  }\n  if (!window.ExcelJS?.Workbook) {\n    alert("Libreria Excel non disponibile. Controlla la connessione e riprova.");\n    return;\n  }\n\n  try {'
          if old not in hours_text:
              raise SystemExit('hours ExcelJS guard marker missing')
          hours.write_text(hours_text.replace(old, new, 1))

          identity = Path('identity-card-feature.js')
          identity_text = identity.read_text()
          old = '    try {\n      let file = null;\n      if (window.html2canvas && businessPreview) {'
          new = '    try {\n      let file = null;\n      if (!window.html2canvas && window.HeraHeavyLibs?.ensure) {\n        try { await window.HeraHeavyLibs.ensure("html2canvas"); } catch (_) {}\n      }\n      if (window.html2canvas && businessPreview) {'
          if old not in identity_text:
              raise SystemExit('identity html2canvas marker missing')
          identity.write_text(identity_text.replace(old, new, 1))
          PY
      - name: Validate diff
        run: |
          git diff --check
          ! git diff -- app.js | grep -q .
          ! git diff | grep -E 'FATTO|fattoVisualEvidence|WHAZZUP|WhatsApp' || (echo 'Protected flow text found in diff' && exit 1)
          grep -q 'heavy-libs-lazy-loader.js?v=20260815a' index.html
          ! grep -q 'cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' index.html
          ! grep -q 'cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js' index.html
          ! grep -q 'cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js' index.html
          ! grep -q 'cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js' index.html
          grep -q 'unpkg.com/leaflet@1.9.4/dist/leaflet.js' index.html
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js hours-export-range.js identity-card-feature.js
          git diff --cached --quiet && exit 0
          git commit -m "Rendi lazy librerie Excel e PDF"
          git push origin HEAD:feat/speed-lazy-heavy-libs-20260815
