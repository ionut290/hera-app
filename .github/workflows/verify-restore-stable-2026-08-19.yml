name: Verify restore VARGA-STABLE-2026-08-19

on:
  push:
    branches:
      - ops/full-backup-2026-08-19
    paths:
      - '.github/workflows/verify-restore-stable-2026-08-19.yml'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: hera-app-6cd2b
      BACKUP_BUCKET: gs://hera-app-6cd2b-dr-backups-645390631375
      SNAPSHOT_PREFIX: stable-2026-08-19/firestore-logical-fast/run-32273638995

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report verification start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: `🧪 Avviata verifica DRY RUN del ripristino Firestore — run ${context.runId}. Nessuna scrittura verrà eseguita.`
            });

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HERA_APP_6CD2B }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install Firebase Admin runtime
        run: npm install --prefix functions --no-audit --no-fund

      - name: Download stable Firestore snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/restore-source"
          gcloud storage rsync --recursive "$BACKUP_BUCKET/$SNAPSHOT_PREFIX" "$RUNNER_TEMP/restore-source"
          test -s "$RUNNER_TEMP/restore-source/manifest.json"
          test -s "$RUNNER_TEMP/restore-source/documents.jsonl"

      - name: Validate full restore in dry-run mode
        id: dryrun
        env:
          DRY_RUN: 'true'
          TARGET_DATABASE_ID: hera-restore-20260819
          EXACT_RESTORE: 'true'
        run: node .github/backup/firestore-logical-restore.js "$RUNNER_TEMP/restore-source"

      - name: Report verified restore
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: [
                '### ✅ Ripristino Firestore verificato',
                '',
                `- Snapshot: \`${process.env.SNAPSHOT_PREFIX}\``,
                '- Modalità prova: **SUCCESS**',
                '- Scritture Firestore eseguite: **0**',
                '- Cancellazioni Firestore eseguite: **0**',
                '- Tutti i record del backup sono stati letti, validati e decodificati dal tool di restore.',
                '',
                'Il ripristino reale resta protetto da doppia conferma esplicita.'
              ].join('\n')
            });

      - name: Report failed verification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1194,
              body: `❌ Verifica DRY RUN del ripristino Firestore fallita — run ${context.runId}. Il restore non deve essere usato finché questo controllo non passa.`
            });
