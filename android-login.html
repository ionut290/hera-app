<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Apri Varga Cantieri</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#111214;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(460px,100%);background:#1c1e20;border:1px solid #34373a;border-radius:18px;padding:24px;box-sizing:border-box;text-align:center}
    h1{font-size:1.4rem;margin:0 0 10px}p{color:#c9cdd1;line-height:1.45}.btn{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:14px 16px;border-radius:12px;border:0;text-decoration:none;font-weight:700;font-size:1rem}.primary{background:#fff;color:#111214}.secondary{background:#2b2e31;color:#fff}.small{font-size:.86rem;color:#92979c;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <h1>📱 Apri Varga Cantieri</h1>
    <p id="status">Sto aprendo l'app Android…</p>
    <a id="open-app" class="btn primary" href="#">APRI APP ANDROID</a>
    <a id="open-pwa" class="btn secondary" href="./index.html">ACCEDI DA PWA</a>
    <p class="small">Se l'app Android non si apre automaticamente, premi “APRI APP ANDROID”.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const params = new URLSearchParams(window.location.search);
      const payload = params.get("temp-login") || "";
      const safePayload = encodeURIComponent(payload);
      const deepLink = `vargacantieri://login?temp-login=${safePayload}`;
      const pwaLink = `./index.html#temp-login=${safePayload}`;
      const openApp = document.getElementById("open-app");
      const openPwa = document.getElementById("open-pwa");
      const status = document.getElementById("status");

      if (!payload) {
        status.textContent = "Link di accesso non valido o incompleto.";
        openApp.hidden = true;
        openPwa.href = "./index.html";
        return;
      }

      openApp.href = deepLink;
      openPwa.href = pwaLink;

      let hidden = false;
      const onVisibility = () => { if (document.hidden) hidden = true; };
      document.addEventListener("visibilitychange", onVisibility, { passive: true });

      window.setTimeout(() => {
        try { window.location.href = deepLink; } catch (_) {}
      }, 120);

      window.setTimeout(() => {
        if (!hidden) status.textContent = "Se l'app non si è aperta, premi il pulsante qui sotto.";
      }, 1400);
    })();
  </script>
</body>
</html>
