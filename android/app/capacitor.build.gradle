// Dipendenze native aggiuntive per geofence/background location
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // API nativa usata dal plugin Capacitor HeraBiometric (compatibile con Capacitor 7).
    implementation "androidx.biometric:biometric:1.1.0"

    // CameraX: mantiene la fotocamera aperta mentre si scattano più foto Whazzup.
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
}
