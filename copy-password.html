<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Copia password · Varga Cantieri</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f5f7; color: #17202a; padding: 20px; box-sizing: border-box; }
    main { width: min(100%, 460px); background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.12); box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 1.55rem; }
    p { line-height: 1.45; }
    .password { width: 100%; box-sizing: border-box; font: 700 1.2rem ui-monospace, SFMono-Regular, Menlo, monospace; padding: 14px; border: 1px solid #cbd5df; border-radius: 12px; background: #f7f9fb; color: #111; }
    button { width: 100%; margin-top: 14px; border: 0; border-radius: 12px; padding: 15px 18px; font-weight: 800; font-size: 1rem; background: #147a42; color: #fff; cursor: pointer; }
    #feedback { min-height: 24px; margin-bottom: 0; font-weight: 600; }
    .muted { color: #66727f; font-size: .92rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #11161c; color: #f4f7fa; }
      main { background: #1c242d; }
      .password { background: #10161c; color: #fff; border-color: #485563; }
      .muted { color: #b3bec9; }
    }
  </style>
</head>
<body>
  <main>
    <h1>📋 Copia password</h1>
    <p>Premi il pulsante per copiare la password temporanea, poi incollala nell'app Varga Cantieri.</p>
    <input id="password" class="password" type="text" readonly autocomplete="off" aria-label="Password temporanea">
    <button id="copy" type="button">COPIA PASSWORD</button>
    <p id="feedback" role="status" aria-live="polite"></p>
    <p class="muted">Questa pagina non salva la password. Chiudi la pagina dopo averla copiata.</p>
  </main>
  <script>
    (() => {
      "use strict";
      const password = new URLSearchParams(window.location.search).get("password") || "";
      const input = document.getElementById("password");
      const button = document.getElementById("copy");
      const feedback = document.getElementById("feedback");
      input.value = password;
      if (!password) {
        button.disabled = true;
        feedback.textContent = "Password non presente nel link.";
        return;
      }
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(password);
          feedback.textContent = "✅ Password copiata. Ora puoi incollarla nell'app.";
          button.textContent = "✓ PASSWORD COPIATA";
        } catch (_) {
          input.focus();
          input.select();
          try {
            const copied = document.execCommand("copy");
            feedback.textContent = copied
              ? "✅ Password copiata. Ora puoi incollarla nell'app."
              : "Password selezionata: usa Copia dal menu del telefono.";
          } catch (_) {
            feedback.textContent = "Password selezionata: usa Copia dal menu del telefono.";
          }
        }
      });
    })();
  </script>
</body>
</html>
