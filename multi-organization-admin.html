<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hera Platform · Super Admin</title><link rel="stylesheet" href="multi-organization-admin.css"></head><body><main class="shell"><header><div><p class="eyebrow">HERA PLATFORM</p><h1>Gestione organizzazioni</h1><p id="session">Non autenticato</p><strong id="access-state"></strong></div><div><button id="login">Accedi con Google</button><button id="logout" hidden>Esci</button></div></header><p id="feedback" role="status"></p><section data-protected hidden><section data-super-admin hidden class="panel"><div class="panel-head"><h2>Organizzazioni</h2><button id="refresh-organizations">Aggiorna</button></div><div id="organizations-list" class="grid"></div></section><section data-super-admin hidden class="panel"><h2>Crea organizzazione</h2><form id="organization-form"><label>Nome<input id="organization-name" required></label><label>ID organizzazione<input id="organization-id" placeholder="generato dal nome"></label><label>Email amministratore<input id="organization-admin-email" type="email" placeholder="facoltativa"></label><button type="submit">Crea organizzazione</button></form></section><section data-super-admin hidden class="panel"><h2>Migrazione utenti attuali verso Varga</h2><p>Prima viene eseguita una simulazione. Le scritture partono solo dopo conferma.</p><div class="actions"><button id="migration-dry-run">Esegui dry-run</button><button id="migration-apply" disabled>Applica migrazione</button></div><pre id="migration-result"></pre></section></section></main><script type="module" src="multi-organization-admin.js"></script></body></html>
