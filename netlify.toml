[build]
  command = "node scripts/stamp-pwa-build-version.js"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/fuel-stations/search"
  to = "/.netlify/functions/fuel-stations"
  status = 200

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

[[redirects]]
  from = "/api/google-sheet-import"
  to = "/.netlify/functions/google-sheet-import"
  status = 200

[[redirects]]
  from = "/api/google-sheet-sync"
  to = "/.netlify/functions/google-sheet-sync"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/browser-reset.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/operational-import-repair.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/google-sheet-two-way-sync.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
