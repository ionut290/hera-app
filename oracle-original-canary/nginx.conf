server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  location ~ (^|/)\. { deny all; }
  location ~ ^/(android|docs|functions|google-apps-script|netlify|oracle-original-canary|oracle-pilot-api|oracle-pilot-web|scripts)(/|$) { deny all; }
  location ~ ^/(AGENTS\.md|AUTH_STABILITY_CONTRACT\.md|package(-lock)?\.json|firebase\.json|firestore\.(rules|indexes\.json)|storage\.rules|netlify\.toml)$ { deny all; }

  location /oracle-api/ {
    proxy_pass http://varga-pilot-api:18082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location = /index.html {
    sub_filter_once on;
    sub_filter '</head>' '<script>window.__HERA_ORACLE_PILOT__={enabled:true,baseUrl:"/oracle-api",allowedEmail:"ionut29019@gmail.com"};</script><script src="oracle-read-adapter.js"></script></head>';
    sub_filter '</body>' '<script src="oracle-canary-bootstrap.js"></script></body>';
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ /index.html; }
}
