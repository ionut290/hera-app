services:
  varga-pilot-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18083:18082"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18082/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  database:
    external: true
    name: db_default
