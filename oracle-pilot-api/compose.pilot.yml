services:
  varga-pilot-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:18083:18082"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18082/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  varga-pilot-web:
    build: ../oracle-pilot-web
    restart: unless-stopped
    depends_on:
      varga-pilot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18084:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=2m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    networks:
      - database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  varga-original-canary:
    build:
      context: ..
      dockerfile: oracle-original-canary/Dockerfile
    restart: unless-stopped
    depends_on:
      varga-pilot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18085:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=2m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - database
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  database:
    external: true
    name: db_default
