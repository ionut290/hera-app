# Initial database-only pilot, same project and volume as compose.yml.
name: varga-v2-oracle
services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    cpus: 0.50
    mem_limit: 768m
    cpu_shares: 128
    pids_limit: 150
    environment:
      POSTGRES_DB: varga_v2_oracle
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
      - app_db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-varga-init.sh:ro
      - ../migrations:/opt/varga-migrations:ro
    networks: [private_db]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d varga_v2_oracle"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  private_db:
    internal: true
volumes:
  pgdata: {}
secrets:
  db_owner_password:
    file: ${VARGA_SECRETS_DIR:?set absolute VARGA_SECRETS_DIR}/db-owner-password
  app_db_password:
    file: ${VARGA_SECRETS_DIR:?set absolute VARGA_SECRETS_DIR}/app-db-password
