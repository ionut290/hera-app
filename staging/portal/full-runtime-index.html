<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src http://127.0.0.1:9099 http://127.0.0.1:8080; frame-src 'self'; base-uri 'none'; form-action 'none'; worker-src 'none'">
<title>Varga Cantieri 2.0</title>
<style>
:root{--ink:#142b20;--muted:#5e7068;--primary:#0f5c43;--border:#d7e1dc;--panel:#fff;--bg:#f3f7f4;--shadow:0 18px 50px #12352418}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#f7faf8 0%,#eaf2ed 100%);padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:grid;place-items:center}
.auth-shell{width:min(100%,440px)}
.auth-gate-card{display:grid;gap:12px;width:100%;padding:30px 26px;border:1px solid var(--border);border-radius:24px;background:var(--panel);box-shadow:var(--shadow);text-align:center}
.auth-gate-logo{width:78px;height:78px;display:grid;place-items:center;justify-self:center;border-radius:22px;background:#18251f;overflow:hidden}
.auth-gate-logo img{width:100%;height:100%;object-fit:cover}
.auth-gate-kicker{margin:0;color:var(--primary);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.auth-gate-card h1,.auth-gate-card p{margin:0}
.muted{color:var(--muted);line-height:1.5}
.auth-email-form{display:grid;gap:8px;margin-top:8px;text-align:left}
.auth-email-form label{font-size:.86rem;font-weight:800;color:var(--muted)}
input,button{font:inherit}
input{width:100%;padding:14px 15px;border:1px solid #cbd8d1;border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid #b8dccb;border-color:var(--primary)}
button{padding:12px 16px;border:1px solid #c9d4cf;border-radius:12px;background:#eef1ef;color:var(--ink);cursor:pointer}
.btn-primary{margin-top:8px;border-color:var(--primary);background:var(--primary);color:#fff;font-weight:800}
.status{min-height:1.3em;margin-top:6px!important;color:var(--muted);font-size:.9rem;text-align:center}
#companies{display:grid;gap:10px;margin-top:16px}
#companies button{width:100%;padding:16px;text-align:left;background:#fff;border-color:#b9cec1;box-shadow:0 5px 18px #1235240d}
#admin-panel{width:min(100%,700px);margin:12px auto}
#admin-panel [data-admin-tenant],#admin-panel [data-member]{padding:12px;border:1px solid #bacdc0;border-radius:10px;margin:8px 0;background:#fff}
#admin-panel input{max-width:90%}
#back,#logout,#admin-toggle,#company-return{font-size:13px}
body.company-runtime{display:block;margin:0;padding:0;background:#fff}
body.company-runtime #launcher-header,body.company-runtime #companies,body.company-runtime #admin-panel,body.company-runtime #back,body.company-runtime #logout,body.company-runtime #admin-toggle{display:none!important}
body.company-runtime #runtime{position:fixed;inset:0;width:100%;height:100%;border:0}
#company-return{position:fixed;z-index:9999;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:#fff;color:var(--ink);box-shadow:0 1px 6px #0003}
iframe{width:100%;height:78vh;border:1px solid #aaa;background:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="auth-shell">
<section class="auth-gate-card" aria-labelledby="login-title">
<div class="auth-gate-logo"><img src="./icons/varga-cantieri-512.png" alt="Varga Cantieri"></div>
<p class="auth-gate-kicker">Varga Cantieri</p>
<h1 id="login-title">Login richiesto</h1>
<p class="muted">Accedi con il tuo account aziendale verificato.</p>
<form id="login" class="auth-email-form" autocomplete="on">
<label for="email">Email</label>
<input id="email" type="email" required placeholder="email@azienda.it" autocomplete="username">
<label for="password">Password</label>
<input id="password" type="password" required placeholder="Password" autocomplete="current-password">
<button class="btn-primary" type="submit">Entra</button>
<p id="status" class="status" role="status">Accedi con un account staging verificato.</p>
</form>
</section>
<div id="companies" hidden></div>
</main>
<section id="admin-panel" hidden aria-label="Super Admin"></section>
<button id="admin-toggle" hidden>Super Admin</button>
<button id="back" hidden>Cambia azienda</button>
<button id="company-return" hidden>Esci dall’azienda</button>
<button id="logout" hidden>Esci</button>
<iframe id="runtime" title="Varga Cantieri originale" sandbox="allow-scripts allow-same-origin allow-forms" hidden></iframe>
<script src="launcher.js"></script>
</body>
</html>
