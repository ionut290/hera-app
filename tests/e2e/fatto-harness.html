<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hera E2E FATTO Harness</title>
</head>
<body>
  <main>
    <h1>Commessa di prova</h1>
    <section id="impianto-card">
      <h2>Impianto E2E 001</h2>
      <button id="fatto-btn" type="button">FATTO / WHAZZUP</button>
    </section>
  </main>

  <script>
    window.selectedCommessaId = "commessa-e2e";
    window.auth = {
      currentUser: {
        uid: "utente-e2e",
        email: "e2e@example.invalid",
        displayName: "Operatore E2E"
      }
    };

    window.__e2e = {
      originalCalls: 0,
      whatsappCalls: 0,
      lastImpianto: null
    };

    window.openWhatsApp = function () {
      window.__e2e.whatsappCalls += 1;
      return true;
    };

    window.handleImpiantoWhatsAppClick = async function (impianto) {
      window.__e2e.originalCalls += 1;
      window.__e2e.lastImpianto = impianto;
      window.openWhatsApp("whatsapp://send?text=Impianto%20fatto");
      return true;
    };

    document.getElementById("fatto-btn").addEventListener("click", async () => {
      await window.handleImpiantoWhatsAppClick({
        id: "impianto-e2e-001",
        idSap: "SAP-E2E-001",
        nome: "Impianto E2E 001"
      });
    });
  </script>
  <script src="../../fatto-button-immediate.js"></script>
</body>
</html>
