<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><title>Login E2E Harness</title></head>
<body>
  <form id="auth-email-form" autocomplete="on">
    <input id="auth-email-input" type="email" value="operatore@example.com">
    <input id="auth-password-input" type="password" value="PasswordTest123!">
    <button id="auth-password-toggle-btn" type="button">👁️</button>
    <input id="auth-remember-login" type="checkbox" checked>
    <button id="auth-email-login-btn" type="submit">Entra</button>
    <button id="auth-create-account-btn" type="button">Crea</button>
    <p id="auth-email-feedback"></p>
  </form>
  <dialog id="registration-dialog"><form id="registration-form"></form></dialog>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const email = params.get('email') || 'operatore@example.com';
      const uid = params.get('uid') || 'uid-operatore-1';
      const remembered = params.get('remembered') !== '0';
      const hasSession = params.get('session') !== 'none';
      const hasCurrentUser = params.get('currentUser') !== 'none';
      const online = params.get('online') !== '0';
      const unsupportedLocalPersistence = params.get('persistence') === 'unsupported-local';

      Object.defineProperty(navigator, 'onLine', { configurable: true, get: () => online });
      document.getElementById('auth-email-input').value = email;
      document.getElementById('auth-remember-login').checked = remembered;
      localStorage.setItem('heraRememberLogin', remembered ? 'true' : 'false');
      if (hasSession) {
        localStorage.setItem('heraPersistedUserSession', JSON.stringify({
          version: 1,
          uid,
          email,
          displayName: 'Operatore Test',
          accessApproved: true,
          banned: false,
          lastLoginAt: new Date().toISOString()
        }));
      } else {
        localStorage.removeItem('heraPersistedUserSession');
      }

      const listeners = new Set();
      const state = {
        signInCalls: 0,
        signOutCalls: 0,
        persistenceCalls: [],
        currentUser: hasCurrentUser ? { uid, email, emailVerified: true } : null
      };
      const auth = {
        get currentUser() { return state.currentUser; },
        setPersistence(value) {
          state.persistenceCalls.push(value);
          if (unsupportedLocalPersistence && value === 'LOCAL') {
            const error = new Error('Persistence type is not supported.');
            error.code = 'auth/unsupported-persistence-type';
            return Promise.reject(error);
          }
          return Promise.resolve();
        },
        signInWithEmailAndPassword(loginEmail) {
          state.signInCalls += 1;
          state.currentUser = { uid, email: loginEmail, emailVerified: true };
          listeners.forEach((fn) => fn(state.currentUser));
          return Promise.resolve({ user: state.currentUser });
        },
        signOut() { state.signOutCalls += 1; state.currentUser = null; return Promise.resolve(); },
        onAuthStateChanged(next) {
          listeners.add(next);
          queueMicrotask(() => next(state.currentUser));
          return () => listeners.delete(next);
        }
      };
      function authFactory() { return auth; }
      authFactory.Auth = { Persistence: { LOCAL: 'LOCAL', SESSION: 'SESSION', NONE: 'NONE' } };
      authFactory.Persistence = authFactory.Auth.Persistence;

      window.firebase = {
        auth: authFactory,
        firestore() { return { collection() { throw new Error('Firestore non previsto nel test login'); } }; }
      };
      window.__loginTest = state;
    })();
  </script>
  <script src="../../login-retry-fix.js"></script>
</body>
</html>
